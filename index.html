var CUSTOM=store.get('custom',[]);
function customToCalc(c){
  var ast=null, perr=null; try{ ast=EXPR.parse(c.formula); }catch(e){ perr=e.message; }
  var inputs=(c.inputs||[]).map(function(i){ return Num(i.k,i.l+(i.u?' ('+i.u+')':''),i.def===''||i.def==null?null:+i.def); });
  if(c.dens) inputs.push({type:'mat',k:'mat',def:c.mat||'ms',grp:null});
  return {id:'cu:'+c.id,cat:'custom',name:c.name,sub:c.desc||'Custom formula',ic:'grid',kw:'custom '+c.name+' '+(c.desc||''),custom:c,fl:[c.rl+' = '+c.formula],inputs:inputs,
    calc:function(v,R){
      if(perr) return R.err('Formula error: '+perr);
      var vars={}; (c.inputs||[]).forEach(function(i){ vars[i.k]=v[i.k]; }); if(c.dens){ vars.rho=v.rho; if(!(v.rho>0)) return R.err('Enter a density'); }
      var r; try{ r=EXPR.ev(ast,vars); }catch(e){ return R.err(e.message); }
      if(!isFinite(r)) return R.err('Result is not a finite number — check inputs (division by zero?)');
      R.meta({std:'User-defined formula',src:['user'],kind:'Calculated (custom formula)'});
      R.step(c.rl||'Result',(c.rl||'Result')+' = '+c.formula,EXPR.subst(c.formula,vars),r,c.ru||'');
      R.res(c.rl||'Result',r,'count',{u:c.ru||'',main:true}); R.sum=c.name+' → '+nf(r,3)+' '+(c.ru||''); R.shape={sh:'none',p:{}};
    }};
}

/* ------------------------------------------------------------------ number parsing (accepts 3/8, 1-1/2, 10'6", 1,250) */
function parseNum(s,unit){
  if(s==null) return NaN; s=String(s).trim().replace(/,/g,''); if(s==='') return NaN;
  var m=/^(-?\d+(?:\.\d+)?)\s*'\s*(?:-?\s*(\d+(?:\.\d+)?(?:\s+\d+\/\d+)?|\d+\/\d+)\s*(?:"|''|in)?)?$/.exec(s);
  if(m){ var ft=+m[1], inch=m[2]?parseNum(m[2]):0; var totFt=ft+(ft<0?-inch:inch)/12; return unit==='in'?totFt*12:unit&&unit!=='ft'&&unit!=='RFT'?NaN:totFt; }
  m=/^(-?\d+)[\s-]+(\d+)\/(\d+)$/.exec(s); if(m){ var w=+m[1]; return w+(w<0?-1:1)*(+m[2]/+m[3]); }
  m=/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(s); if(m) return +m[1]/+m[2];
  s=s.replace(/["']$/,''); return /^-?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)? +s : NaN;
}

var LAST=store.get('last',{});
function freshState(c){
  var st={vals:{},units:{},rows:{},sec:{},mat:{},gstd:{},gman:{}};
  c.inputs.forEach(function(i){
    if(i.type==='sel') st.vals[i.k]=i.def;
    else if(i.type==='sec'){ var d=i.def||[]; var idx=-1; if(d[0]&&SER[d[0]]) SER[d[0]].rows.some(function(r,j){ if(r[0]===d[1]){ idx=j; return true; } }); st.sec[i.k]=d[0]&&idx>=0?[d[0],idx]:(i.custom?['custom',-1]:[firstSeries(i,st),0]); }
    else if(i.type==='mat') st.mat[i.k]={id:i.def,rho:null,touched:false,u:'kg/m³'};
    else if(i.type==='rows'){ st.rows[i.k]=(i.def||[{}]).map(function(r){ return Object.assign({},r); }); st.units[i.k]=i.u; }
    else { st.vals[i.k]=i.def==null?'':String(i.def); if(i.dim) st.units[i.k]=i.u; if(i.gauge) st.gstd[i.k]=i.gauge.auto?'auto':i.gauge.std; }
  });
  return st;
}
function firstSeries(i,st){ var f=typeof i.fams==='function'?i.fams({}):i.fams; for(var k=0;k<SERIES.length;k++) if(f.indexOf(SERIES[k].fam)>=0) return SERIES[k].id; return null; }
function famsOf(i,v){ return typeof i.fams==='function'?i.fams(v):i.fams; }

function readV(c,st){
  var v={_raw:{},_u:{},_missing:[],_bad:[]};
  c.inputs.forEach(function(i){ if(i.type==='sel') v[i.k]=st.vals[i.k]; });
  c.inputs.forEach(function(i){
    if(i.type==='sec'){ var s=st.sec[i.k]||['custom',-1]; v[i.k]=s[0]&&s[0]!=='custom'?secObj(s[0],s[1]):null; }
    else if(i.type==='mat'){ var ms=st.mat[i.k], m=MAT[ms.id], base=matRho(ms.id), rho;
      if(ms.touched&&ms.rho!==''&&ms.rho!=null){ rho=toSI(parseNum(ms.rho),'dens',ms.u||'kg/m³'); v.rhoCustom=true; v.rhoWhy='User-defined density (entered here)'; }
      else { rho=base.rho; v.rhoCustom=base.custom; v.rhoWhy=base.why; }
      v.rho=rho; v.matName=m?m.name:ms.id; v.matId=ms.id; }
  });
  c.inputs.forEach(function(i){
    if(i.type==='rows'){ var u=st.units[i.k]||i.u; v._u[i.k]=u; v[i.k]=(st.rows[i.k]||[]).map(function(r){ var o={}; i.cols.forEach(function(cc,ci){ var x=parseNum(r[cc[0]]); o[cc[0]]=(ci===0||cc[2]==='raw')?x:conv(x,'len',u,i.base); }); return o; }); }
    else if(i.gauge&&st.units[i.k]==='Gauge'){ var gs=gstdOf(i,st,v), gn=parseNum(st.vals[i.k]), gin=gaugeIn(gs,gn); v._raw[i.k]=gn; v._u[i.k]='Gauge'; v._gauge=v._gauge||{};
      if(gin!=null){ v._gauge[i.k]={std:gs,g:gn,inch:gin,mm:gin*25.4}; v[i.k]=conv(gin,'len','in',i.base||'m'); } else v[i.k]=NaN; }
    else if(i.type==='num'||i.dim){ var raw=parseNum(st.vals[i.k],st.units[i.k]); v._raw[i.k]=raw; v._u[i.k]=st.units[i.k];
      var val=raw; if(i.dim&&isFinite(raw)) val=conv(raw,i.dim,st.units[i.k],i.base||UNITS[i.dim].base); v[i.k]=isFinite(val)?val:(i.opt?0:NaN); }
  });
  c.inputs.forEach(function(i){ var vis=isVisible(i,v); if(!vis||i.type==='sel'||i.type==='sec'||i.type==='mat'||i.type==='rows') return;
    var raw=v._raw[i.k], s=String(st.vals[i.k]==null?'':st.vals[i.k]).trim(), lab=labelOf(i,v);
    if(s===''){ if(!i.opt) v._missing.push(lab); return; }
    if(!isFinite(raw)){ v._bad.push(lab+': “'+s+'” is not a number'+(i.dim==='len'?' (use decimals, 3/8, 1-1/2 or 10\'6")':'')); return; }
    if(i.gauge&&st.units[i.k]==='Gauge'&&isFinite(raw)&&!(v._gauge&&v._gauge[i.k])){ var gsn=GSTD[gstdOf(i,st,v)]; v._bad.push(lab+': '+s+' Gauge is not in the '+(gsn?gsn.name:'selected')+' table (10–30) — no verified thickness'); return; }
    if(raw<0) v._bad.push(lab+' cannot be negative');
    else if(raw===0&&!i.allow0&&!i.opt) v._bad.push(lab+' must be greater than zero');
    if(i.int&&raw!==Math.round(raw)) v._bad.push(lab+' must be a whole number');
  });
  c.inputs.forEach(function(i){ if(i.type==='mat'&&isVisible(i,v)&&v.rho!=null&&!(v.rho>0)) v._bad.push('Density must be greater than zero'); });
  return v;
}
function gstdOf(i,st,v){ var s=st.gstd&&st.gstd[i.k]; if(!s||s==='auto'||!GSTD[s]) return (v&&v.matId&&MAT_GAUGE[v.matId])||i.gauge.std; return s; }
function geqText(i,v){ var g=v&&v._gauge&&v._gauge[i.k]; if(!g) return '<span class="zc-gbad">No verified thickness for this gauge in the selected standard</span>';
  var s=GSTD[g.std]; return 'Selected: <b>'+nf(g.g,0)+' Gauge</b> ('+esc(s.name)+') → Equivalent thickness: <b>'+nf(g.mm,3)+' mm</b> · <b>'+nf(g.inch,4)+' in</b> <small>'+esc(s.std)+'</small>'; }
function isVisible(i,v){ if(i.hide) return false; if(!i.show) return true; try{ return !!i.show(v); }catch(e){ return true; } }
function labelOf(i,v){ if(i.lab){ try{ var l=i.lab(v); if(l) return l; }catch(e){} } return i.l; }

function runCalc(c,st){
  var v=readV(c,st), R={steps:[],results:[],warns:[],errs:[],notes:[],m:{},sum:'',shape:null,props:null,
    step:function(t,f,w,val,u){ this.steps.push({t:t,f:f,w:w,v:val,u:u}); },
    res:function(l,val,dim,o){ this.results.push({l:l,v:val,dim:dim,o:o||{}}); },
    warn:function(m){ this.warns.push(m); }, err:function(m){ this.errs.push(m); }, note:function(m){ this.notes.push(m); },
    meta:function(o){ for(var k in o) this.m[k]=o[k]; }, bad:function(){ return this.errs.length>0; }};
  v._missing.forEach(function(l){ R.err(l+' is required'); }); v._bad.forEach(function(m){ R.err(m); });
  if(!R.errs.length){ try{ c.calc(v,R); }catch(e){ R.err('Calculation error: '+e.message); } }
  R.conv=Object.keys(v._gauge||{}).filter(function(k){ var i=c.inputs.filter(function(x){return x.k===k;})[0]; return i&&isVisible(i,v); }).map(function(k){ var i=c.inputs.filter(function(x){return x.k===k;})[0], g=v._gauge[k], s=GSTD[g.std];
    return {k:k,lab:labelOf(i,v),g:g,s:s,text:nf(g.g,0)+' Gauge ('+s.name+') = '+nf(g.mm,3)+' mm = '+nf(g.inch,4)+' in — '+s.std}; });
  if(!R.errs.length&&R.conv.length){ R.conv.slice().reverse().forEach(function(x){ R.steps.unshift({t:'Conversion: '+x.lab,f:'Gauge → thickness ('+x.s.std+')',w:nf(x.g.g,0)+' Gauge → '+nw(x.g.inch)+' in × 25.4',v:x.g.mm,u:'mm'}); });
    var at=0; while(at<R.results.length&&R.results[at].o.main) at++;
    R.conv.forEach(function(x,j){ R.results.splice(at+j,0,{l:'Equivalent thickness — '+nf(x.g.g,0)+' Gauge ('+x.s.name+')',v:x.g.mm/1000,dim:'len',o:{units:['mm','in']}}); });
    R.m.src=(R.m.src||[]).concat(R.conv.map(function(x){return x.s.src;})); }
  if(!R.m.dens&&v.rho!=null) R.m.dens={rho:v.rho,custom:v.rhoCustom,name:v.matName,why:v.rhoWhy};
  if(R.errs.length){ R.results=[]; }
  R.v=v; return R;
}

function stateFor(c,view){

(function(){
  var el=document.getElementById('sqVisits'); if(!el||!window.fetch) return;
  var API='https://abacus.jasoncameron.dev/', NS='sajjad-qscalculator', day;
  try{ day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Karachi',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ day=new Date().toISOString().slice(0,10); }
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
  function count(key,flag,val){   // hit once (first visit of this device for the period), else read
    var hit=ls(flag)!==val, ctl=window.AbortController?new AbortController():null, t=setTimeout(function(){ if(ctl) ctl.abort(); },6000);
    return fetch(API+(hit?'hit/':'get/')+NS+'/'+key,{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){ clearTimeout(t); if(r.status===404) return {value:0}; if(!r.ok) throw new Error('counter '+r.status); return r.json(); })
      .then(function(j){ if(hit) ls(flag,val); return Math.max(+j.value||0,hit?1:0); });
  }
  Promise.all([count('day-'+day,'sqcalc.visit.day',day),count('visitors','sqcalc.visit.ever','1')]).then(function(v){
    el.innerHTML='<span class="sq-eye">&#128065;</span> Visitors <b>Today '+v[0].toLocaleString('en-US')+'</b><i>&middot;</i><b>Total '+v[1].toLocaleString('en-US')+'</b>';
    el.title='Different phones / PCs that opened this calculator — today (Pakistan date) and in total'; el.hidden=false;
  }).catch(function(){ el.hidden=true; });
})();
</script>
