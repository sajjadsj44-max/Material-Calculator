.zc-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.zc-f[hidden]{display:none}
.zc-f-wide{grid-column:1/-1}
.zc-f label{font-size:11.5px;color:#43566b;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.zc-f select,.zc-f input[type=text],.zc-f input[type=search]{width:100%;border:1px solid #cfd9e4;border-radius:7px;padding:8px 9px;font-size:13.5px;background:#fff;color:var(--txt);min-height:38px}
.zc-f select:focus,.zc-f input:focus{outline:0;border-color:var(--zc);box-shadow:0 0 0 2px rgba(14,111,124,.14)}
.zc-in{display:flex;gap:5px}.zc-in input{flex:1;min-width:0}
.zc-in select.zc-u{flex:none;width:auto;max-width:48%;padding:8px 5px;background:#f6f9fb;font-size:12.5px}
.zc-f .zc-size{flex:1;min-width:0}.zc-f .zc-sq{flex:0 0 38%}
.zc-hint{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
.zc-conv{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a5a00;background:#fff4dc;border:1px solid #f2d9a4;border-radius:4px;padding:0 4px}
.zc-more{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.zc-more summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--zc);margin-bottom:10px}
.zc-rows table{width:100%;border-collapse:collapse}
.zc-rows th{font-size:10.5px;color:var(--muted);text-align:left;font-weight:600;padding:2px 3px}
.zc-rows td{padding:2px 3px}.zc-rows td input{width:100%;border:1px solid #cfd9e4;border-radius:6px;padding:6px;font-size:13px;min-width:48px}
.zc-rowsb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.zc-rowsb select{border:1px solid #cfd9e4;border-radius:6px;padding:3px}
.zc-x{border:0;background:none;color:#b7c3d0;cursor:pointer;font-size:13px;padding:4px}
.zc-x:hover{color:var(--red)}
.zc-badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 8px}
.zc-b-std{background:#e3f4e8;color:#1c7a3b}.zc-b-user{background:#fff1dc;color:#9a5b00}.zc-b-nv{background:#fde8e8;color:#b12a2a}.zc-b-typ{background:#eef0fb;color:#4b3b8f}
.zc-rhob{min-height:18px}
.zc-shape{display:flex;justify-content:center}
.zc-svg{width:100%;max-width:330px;height:auto;overflow:visible;color:var(--zc-ink);font-family:"Segoe UI",Arial,sans-serif}
.zc-solid{fill:#dbe7f5;stroke:var(--zc-ink);stroke-width:1.4}
.zc-void{fill:#fff;stroke:var(--zc-ink);stroke-width:1.2}
.zc-side{fill:#c3d5ea;stroke:var(--zc-ink);stroke-width:1.1}.zc-side2{fill:#a9c2df;stroke:var(--zc-ink);stroke-width:1.1}
.zc-line{fill:none;stroke:var(--zc-ink);stroke-linejoin:miter}
.zc-rib{stroke:var(--zc-ink);stroke-width:1.2;opacity:.6}
.zc-dim line{stroke:var(--zc-dim);stroke-width:1;color:var(--zc-dim)}
.zc-dim{color:var(--zc-dim)}
.zc-ext{stroke-width:.6!important;stroke-dasharray:2 2}
.zc-dim text,.zc-dimt,.zc-note{font-size:10.5px;fill:var(--zc-dim);font-weight:500;stroke:none}
.zc-note{fill:#43566b}
.zc-brick{fill:#f1d9c8;stroke:#8a4b2a;stroke-width:1.2}
.zc-open{fill:#fff;stroke:#8a4b2a;stroke-dasharray:3 2}
.zc-tile{fill:#eef3f8;stroke:#9fb3c8}
.zc-water{fill:#bfe0f3;stroke:none}
.zc-ground{stroke:#6b7d92;stroke-width:1.2;stroke-dasharray:6 3}
.zc-sheath{fill:#2d3a48;stroke:#17222e}.zc-ins{fill:#e0e6ec;stroke:#8fa3b8}.zc-cond{fill:#d9893a;stroke:#9a5b1b}
.zc-insul{fill:#f6e7a8;stroke:#b8a043}
.zc-form{fill:#f4e3c2;stroke:#8a6420;stroke-width:3}.zc-conc{fill:#d7dde4;stroke:#6b7d92}.zc-formline{fill:none;stroke:#8a6420;stroke-width:3}.zc-formfill{fill:#8a6420}
.zc-mini .zc-solid{stroke-width:3}.zc-mini .zc-void,.zc-mini .zc-side,.zc-mini .zc-side2{stroke-width:2.4}
.zc-main{display:flex;flex-direction:column;gap:2px;background:var(--zc-l);border:1px solid #c5e2e5;border-radius:9px;padding:10px 12px;margin-bottom:8px}
.zc-main span{font-size:11.5px;color:#325b62;font-weight:600}
.zc-main b{font-size:24px;color:var(--zc-ink);line-height:1.15;overflow-wrap:anywhere}.zc-main b small{font-size:13px;color:#43566b;font-weight:600}
.zc-main em{font-size:12px;color:#43566b;font-style:normal;overflow-wrap:anywhere}.zc-main i,.zc-r i{font-size:11px;color:var(--muted);font-style:normal}
.zc-rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zc-r{border:1px solid #edf1f5;border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.zc-r span{font-size:11px;color:var(--muted)}.zc-r b{font-size:14.5px;color:var(--zc-ink);overflow-wrap:anywhere}.zc-r b small{font-size:11px;color:#43566b}.zc-r em{font-size:11px;color:#43566b;font-style:normal;overflow-wrap:anywhere}
.zc-kind{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 9px}
.zc-kind.pub{background:#e3f4e8;color:#1c7a3b}.zc-kind.calc{background:#eaf1fb;color:#1e5fa8}
.zc-err{background:#fdecec;border:1px solid #f3c2c2;border-radius:8px;padding:9px 11px;color:#9d2020;font-size:12.5px}
.zc-err ul{margin:4px 0 0 18px}
.zc-warn{margin-top:9px;background:#fff7e6;border:1px solid #f2d9a4;border-radius:8px;padding:8px 10px;font-size:12px;color:#7a5200;display:flex;flex-direction:column;gap:4px}
.zc-notes{margin-top:7px;font-size:11.5px;color:#43566b;display:flex;flex-direction:column;gap:3px}
.zc-wd>summary{cursor:pointer;list-style:none}.zc-wd>summary::-webkit-details-marker{display:none}
.zc-wd>summary .zc-ct::after{content:" ▾"}.zc-wd:not([open])>summary .zc-ct::after{content:" ▸"}
.zc-wsec{margin-top:10px}.zc-wh{font-size:10px;letter-spacing:1.3px;font-weight:800;color:var(--zc);margin-bottom:5px}
.zc-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.zc-t{width:100%;border-collapse:collapse;font-size:12.5px}
.zc-t th{background:#f4f7fb;color:#43566b;font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
.zc-t td{padding:6px 8px;border-bottom:1px solid #eef2f7;vertical-align:top}
.zc-t td:first-child{color:#43566b}
.zc-mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:12px}
.zc-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.zc-steps{min-width:680px}.zc-steps td:first-child{min-width:130px}.zc-steps td.zc-num small{color:var(--muted)}
.zc-dt{font-size:11px;color:var(--muted)}.zc-ts{color:#1c7a3b}.zc-tu{color:#9a5b00}
.zc-srcp a{color:var(--zc);font-weight:600;white-space:nowrap}
.zc-props{overflow:hidden}
.zc-sticky{display:none}
.zc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.zc-chips>span{font-size:11px;color:var(--muted);font-weight:700}
.zc-chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--zc-ink);min-height:32px}
.zc-chip.on{background:var(--zc);border-color:var(--zc);color:#fff}
.zc-quick .zc-chip{background:#f6fbfb}
.zc-cvrow{display:grid;grid-template-columns:1fr 1.3fr auto 1.3fr;gap:10px;align-items:end}
.zc-swap{border:1px solid var(--zc);background:#fff;color:var(--zc);border-radius:8px;height:38px;width:44px;font-size:18px;cursor:pointer}
.zc-cvres{margin-top:12px}
.zc-sdbbar{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.zc-sdb tbody tr{cursor:pointer}.zc-sdb tbody tr:hover{background:#f4f9fa}.zc-sdb tbody tr.on{background:var(--zc-l)}
.zc-sdb td.zc-nm{font-weight:600;color:var(--zc-ink);white-space:nowrap}.zc-sdb td small{color:var(--muted)}
.zc-sdbdet{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;align-items:start}
.zc-sdbinfo h4{font-size:17px;color:var(--zc-ink)}.zc-sdbinfo .zc-main{margin-top:8px}.zc-sdbinfo .zc-acts{margin-top:10px}
.zc-fl{border-bottom:1px solid #eef2f7;padding:7px 0}.zc-fl>div{display:flex;justify-content:space-between;gap:8px}.zc-fl b{color:var(--zc-ink);font-size:13px}.zc-fl ul{margin:4px 0 0 18px;color:#43566b}
.zc-ce .zc-rows{margin-top:10px}.zc-ce .zc-acts{margin-top:10px}.zc-ce code{background:#eef2f7;border-radius:4px;padding:0 4px}
.zc-dov{width:110px;border:1px solid #cfd9e4;border-radius:6px;padding:5px}
.zc-flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#17375e;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
.zc-flash.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1100px){.zc-grid{grid-template-columns:1fr}.zc-side{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}}
@media(max-width:820px){
  #appCALC{padding:58px 12px 84px}
  .zc-side{display:flex;flex-direction:column}
  .zc-grid{display:flex;flex-direction:column}
  .zc-fields{grid-template-columns:1fr}
  .zc-cards,.zc-cats{grid-template-columns:1fr}
  .zc-rgrid{grid-template-columns:1fr 1fr}
  .zc-acts button{flex:1 1 auto;min-height:40px}
  .zc-head .zc-acts{width:100%}
  .zc-cvrow{grid-template-columns:1fr}.zc-swap{width:100%}
  .zc-sdbbar,.zc-sdbdet{grid-template-columns:1fr}
  .zc-f select,.zc-f input[type=text],.zc-f input[type=search]{font-size:16px;min-height:44px}
  .zc-in select.zc-u{font-size:14px}
  .zc-svg{max-width:280px}
  .zc-sticky{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--zc-ink);color:#fff;padding:9px 14px calc(9px + env(safe-area-inset-bottom));gap:10px;align-items:baseline;justify-content:space-between;box-shadow:0 -4px 14px rgba(0,0,0,.2)}
  .zc-sticky:empty{display:none}
  .zc-sticky span{font-size:11.5px;opacity:.8}.zc-sticky b{font-size:17px}.zc-sticky b small{font-size:12px;color:#cfe3f3}
  .zc-st-err{color:#ffd0d0!important;opacity:1!important}
  .zc-hrow{flex-wrap:wrap}.zc-hb{width:100%}.zc-hb button{flex:1;min-height:38px}
}
@media print{#appCALC .zc-search,#appCALC .zc-acts,.zc-sticky,.zc-back,.zc-star{display:none!important}}
/* gauge thickness input */
.zc-gstd{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:#43566b;font-weight:600}
.zc-gstd select{flex:1;min-width:0;border:1px solid #cfd9e4;border-radius:7px;padding:6px 8px;font-size:12.5px;background:#f6f9fb}
.zc-geq{margin-top:5px;background:var(--zc-l);border:1px solid #c5e2e5;border-radius:7px;padding:6px 9px;font-size:12px;color:#17375e;line-height:1.45}
.zc-geq small{display:block;color:var(--muted);font-size:10.5px}
.zc-gbad{color:#9d2020}
.zc-gman{margin-top:5px}
.zc-f .zc-gsel{flex:1;min-width:0}
@media(max-width:820px){.zc-gstd{flex-direction:column;align-items:stretch}.zc-gstd select{font-size:15px;min-height:40px}}

body{padding:0 22px}
.zc-page{max-width:1280px;margin:0 auto}
@media(max-width:700px){body{padding:0 12px}}
/* ===== SAJJAD QSCALCULATOR theme (this standalone copy) ===== */
:root{--sq-navy:#0a1f3d;--sq-gold:#f2b632;--sq-gold2:#ffd970;--k:#0c8599;--k2:#22b8cf;--kl:#e3fafc}
.k-civil,.zc-cat[data-cat="civil"],#zcsec-civil{--k:#e8590c;--k2:#ff922b;--kl:#fff4e6}
.k-steel,.zc-cat[data-cat="steel"],#zcsec-steel{--k:#364fc7;--k2:#5c7cfa;--kl:#edf2ff}
.k-fin,.zc-cat[data-cat="fin"],#zcsec-fin{--k:#9c36b5;--k2:#da77f2;--kl:#f8f0fc}
.k-items,.zc-cat[data-cat="items"],#zcsec-items{--k:#0c8599;--k2:#22b8cf;--kl:#e3fafc}
.k-conv,.zc-cat[data-cat="conv"],#zcsec-conv{--k:#2b8a3e;--k2:#51cf66;--kl:#ebfbee}
.k-t0,[data-trade="Earthwork"],[id="zcsec-Earthwork"]{--k:#8d5a2b;--k2:#c58b4e;--kl:#f8efe6}
.k-t1,[data-trade="Concrete (grey structure)"],[id="zcsec-Concrete (grey structure)"]{--k:#1971c2;--k2:#4dabf7;--kl:#e7f5ff}
.k-t2,[data-trade="Masonry"],[id="zcsec-Masonry"]{--k:#d9480f;--k2:#ff8c42;--kl:#fff4e6}
.k-t3,[data-trade="Reinforcement"],[id="zcsec-Reinforcement"]{--k:#364fc7;--k2:#5c7cfa;--kl:#edf2ff}
.k-t4,[data-trade="Plaster & mortar"],[id="zcsec-Plaster & mortar"]{--k:#e67700;--k2:#fcc419;--kl:#fff9db}
.k-t5,[data-trade="Flooring & tiles"],[id="zcsec-Flooring & tiles"]{--k:#2b8a3e;--k2:#51cf66;--kl:#ebfbee}
.k-t6,[data-trade="Painting & coatings"],[id="zcsec-Painting & coatings"]{--k:#c2255c;--k2:#f06595;--kl:#fff0f6}
.k-t7,[data-trade="Waterproofing"],[id="zcsec-Waterproofing"]{--k:#0b7285;--k2:#22b8cf;--kl:#e3fafc}
.k-t8,[data-trade="Ceiling & partitions"],[id="zcsec-Ceiling & partitions"]{--k:#6741d9;--k2:#9775fa;--kl:#f3f0ff}
body{padding:0 20px;font-size:14px;background:#eef3fa;background-image:radial-gradient(1100px 520px at 88% -8%,rgba(92,124,250,.12),transparent 60%),radial-gradient(900px 520px at -8% 34%,rgba(255,146,43,.09),transparent 60%),radial-gradient(800px 500px at 50% 110%,rgba(34,184,207,.10),transparent 60%);background-attachment:fixed}
.zc-page{max-width:1240px;margin:0 auto}
#appCALC{padding:16px 0 84px}
/* hero banner */
.sq-hero{position:relative;border-radius:24px;overflow:hidden;color:#fff;background:radial-gradient(620px 320px at 10% 35%,rgba(242,182,50,.22),transparent 65%),linear-gradient(120deg,#071833 0%,#0f2d57 55%,#174a84 100%);box-shadow:0 20px 44px -20px rgba(8,26,51,.6)}
.sq-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%)}
.sq-hero-in{position:relative;display:flex;align-items:center;gap:28px;padding:28px 32px 50px}
.sq-logo{flex:none;width:136px;height:136px;border-radius:50%;border:3px solid var(--sq-gold);background:#0a1f3d;box-shadow:0 0 0 7px rgba(242,182,50,.16),0 12px 30px rgba(0,0,0,.5)}
.sq-brand{flex:1;min-width:0}
.sq-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.sq-gold{font-size:32px;font-weight:800;letter-spacing:2px;line-height:1.1;color:#ffd45c;background:linear-gradient(180deg,#fff2c0 0%,#ffd45c 45%,#e3a020 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sq-role{font-size:16px;font-weight:700;letter-spacing:2.4px;color:#e8effc}
.sq-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.sq-app{font-size:17px;font-weight:800;letter-spacing:2.2px;color:var(--sq-gold2)}
.sq-tel{display:inline-flex;align-items:center;gap:6px;font-size:15.5px;font-weight:800;letter-spacing:.5px;color:#0a1f3d;text-decoration:none;background:linear-gradient(180deg,#ffe594,#f2b632);padding:7px 16px;border-radius:999px;box-shadow:0 6px 16px -4px rgba(242,182,50,.55)}
.sq-tel:hover{filter:brightness(1.06)}
.sq-hero h2{font-size:25px;font-weight:700;color:#fff;margin:14px 0 2px;letter-spacing:.3px}
.sq-tag{font-size:12.5px;color:#b9cbe6;margin:0 0 12px}
.sq-trades{display:flex;flex-wrap:wrap;gap:8px}
.sq-tr{flex:none;border:0;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--k),var(--k2));padding:7px 13px;border-radius:999px;box-shadow:0 4px 12px -4px rgba(0,0,0,.45);transition:transform .15s,filter .15s}
.sq-tr:hover{transform:translateY(-2px);filter:brightness(1.08)}
.sq-meta{flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.sq-rev{font-size:11.5px;color:#cfe0f7;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:5px 11px;border-radius:999px}
/* HOME: a gold pill in the banner on every page but home, and a round button that floats once the page is scrolled */
.sq-home{display:none;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-size:14.5px;font-weight:800;letter-spacing:1.2px;color:#0a1f3d;background:linear-gradient(180deg,#ffe594,#f2b632);padding:9px 20px;border-radius:999px;box-shadow:0 8px 18px -8px rgba(242,182,50,.75);transition:transform .12s,filter .12s}
.sq-home:hover{filter:brightness(1.06);transform:translateY(-1px)}
.sq-compact .sq-home{display:inline-flex}
.sq-fab{position:fixed;right:22px;bottom:26px;z-index:80;width:58px;height:58px;border-radius:50%;border:3px solid #ffd970;background:linear-gradient(135deg,#0f2d57,#174a84);color:#fff;font-size:25px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 14px 28px -8px rgba(8,26,51,.6)}
.sq-fab:hover{transform:scale(1.06)}
body.sq-scrolled .sq-compact .sq-fab{display:flex}
/* daily visitors (online count) */
.sq-visits{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:4px 8px;font-size:13px;color:#fff;background:linear-gradient(135deg,rgba(242,182,50,.30),rgba(242,182,50,.10));border:1px solid rgba(255,217,112,.65);padding:7px 15px;border-radius:999px;box-shadow:0 8px 18px -10px rgba(242,182,50,.7)}
.sq-visits[hidden]{display:none}
.sq-visits b{color:#ffd970;font-weight:800;font-size:14px}
.sq-visits i{font-style:normal;opacity:.55}
.sq-eye{font-size:16px}
/* search: floats over the banner, stays in reach while scrolling */
#appCALC .zc-search{position:sticky;top:10px;z-index:65;margin:-28px 26px 24px;border:0;border-radius:16px;padding:0 16px;background:#fff;box-shadow:0 16px 32px -14px rgba(10,31,61,.4),0 0 0 2px rgba(18,55,102,.08)}
#appCALC .zc-search:focus-within{box-shadow:0 16px 32px -14px rgba(10,31,61,.4),0 0 0 3px rgba(242,182,50,.6)}
#appCALC .zc-search>span{font-size:19px;color:#0f2d57}
#appCALC .zc-search input{padding:16px 4px;font-size:15.5px}
.zc-sres{border-radius:14px}.zc-si.on,.zc-si:hover{background:#fff7e0}
/* sections */
.zc-sec{margin-bottom:24px}
.zc-sech{font-size:12.5px;letter-spacing:1.2px;color:#0f2d57;font-weight:800;margin:4px 0 12px;padding-left:11px;border-left:4px solid var(--k);line-height:1.35}
.zc-lnk{color:var(--k)}
/* category tiles */
.zc-cats{grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.zc-cat{position:relative;overflow:hidden;border:0;border-radius:18px;padding:16px 16px 14px;min-height:156px;color:#fff;background:linear-gradient(140deg,var(--k) 0%,var(--k2) 100%);box-shadow:0 14px 26px -16px var(--k);transition:transform .15s,box-shadow .15s}
.zc-cat::after{content:"";position:absolute;right:-34px;top:-34px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.13)}
.zc-cat:hover{border:0;transform:translateY(-3px);box-shadow:0 20px 32px -16px var(--k)}
.zc-cat b{color:#fff;font-size:16px;margin-top:8px}.zc-cat span{color:rgba(255,255,255,.92);font-size:12.5px}
.zc-cat em{position:relative;color:#fff;background:rgba(255,255,255,.24);border-radius:999px;padding:3px 11px;align-self:flex-start;margin-top:auto;font-size:11.5px}
.zc-cat .zc-cat-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff!important;font-size:22px!important}
/* calculator cards */
.zc-cards{grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}
.zc-cc{overflow:hidden;border:1px solid #e2e8f1;border-radius:16px;padding:12px 40px 12px 16px;min-height:78px;background:#fff;box-shadow:0 6px 16px -12px rgba(15,41,66,.4)}
.zc-cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--k),var(--k2))}
.zc-cc:hover{border-color:var(--k);box-shadow:0 14px 26px -14px rgba(15,41,66,.45);transform:translateY(-2px)}
.zc-cc-ic{width:54px;height:50px;border-radius:13px;background:var(--kl);display:flex;align-items:center;justify-content:center;color:var(--k)}
.zc-cc-ic .zc-mini{width:42px;height:36px}
.zc-cc-t b{font-size:14px;color:#0f2d57}.zc-cc-t span{font-size:12px}
.zc-chips{gap:8px}
.zc-chip{border:1.5px solid var(--k);color:var(--k);background:var(--kl);font-weight:700;border-radius:999px;padding:7px 14px;min-height:36px}
.zc-chip:hover,.zc-chip.on{background:linear-gradient(135deg,var(--k),var(--k2));color:#fff;border-color:transparent}
.zc-hist{border-radius:16px;box-shadow:0 6px 16px -12px rgba(15,41,66,.4)}
.zc-hb button{border-radius:999px}
/* calculator page */
.zc-head{background:#fff;border-radius:18px;padding:14px 16px;border-top:5px solid var(--k);box-shadow:0 8px 20px -14px rgba(15,41,66,.45);align-items:center}
.zc-back{width:44px;height:44px;border:0;border-radius:50%;color:#fff;font-size:19px;background:linear-gradient(135deg,var(--k),var(--k2));box-shadow:0 8px 16px -8px var(--k)}
.zc-crumb{display:inline-block;color:var(--k);background:var(--kl);border-radius:999px;padding:3px 11px;font-size:10.5px}
.zc-ht h3{font-size:23px;color:#0f2d57;margin:5px 0 2px}.zc-ht p{font-size:12.5px}
.zc-acts{gap:8px}
.zc-acts button{border-radius:999px;padding:8px 15px;font-weight:700;min-height:40px;border:1.5px solid #d8e1ec;transition:transform .12s,filter .12s}
.zc-acts button:hover{transform:translateY(-1px);filter:brightness(.97)}
.zc-acts [data-act="reset"]{color:#495057;background:#f8f9fa}
.zc-acts [data-act="copy"]{color:#1864ab;border-color:#a5d8ff;background:#e7f5ff}
.zc-acts [data-act="print"]{color:#5f3dc4;border-color:#d0bfff;background:#f3f0ff}
.zc-acts [data-act="csv"]{color:#2b8a3e;border-color:#b2f2bb;background:#ebfbee}
.zc-acts [data-act="xls"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,#2b8a3e,#40c057)}
.zc-card{border:1px solid #e2e8f1;border-radius:18px;padding:16px;box-shadow:0 8px 20px -16px rgba(15,41,66,.45)}
.zc-ct{color:var(--k);font-size:11.5px;letter-spacing:1.4px;font-weight:800}
.zc-f label{font-size:12.5px;color:#2f4763}
.zc-f select,.zc-f input[type=text],.zc-f input[type=search]{border:1.5px solid #d3dce8;border-radius:11px;min-height:44px;font-size:15px;padding:9px 11px}
.zc-f select:focus,.zc-f input:focus{border-color:var(--k);box-shadow:0 0 0 3px var(--kl)}
.zc-in select.zc-u{background:var(--kl);border-color:transparent;color:var(--k);font-weight:700}
.zc-rows td input{border:1.5px solid #d3dce8;border-radius:9px;padding:8px;font-size:14px}
.zc-more summary,.zc-wh{color:var(--k)}
.zc-main{border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,var(--k),var(--k2));box-shadow:0 14px 26px -16px var(--k)}
.zc-main span,.zc-main em,.zc-main i,.zc-main b small{color:rgba(255,255,255,.92)!important}
.zc-main b{color:#fff;font-size:32px}
.zc-r{border:0;border-radius:13px;padding:9px 12px;background:var(--kl)}
.zc-r b{color:#0f2d57;font-size:16px}
.zc-t th{background:var(--kl);color:#2f4763}
.zc-sticky{background:linear-gradient(90deg,#0a1f3d,var(--k))!important}
/* calculator pages: the banner is a slimmer bar, so the inputs are in view */
.sq-compact .sq-hero-in{padding:18px 28px 42px;gap:22px}
.sq-compact .sq-logo{width:100px;height:100px}
.sq-compact .sq-gold{font-size:27px}
.sq-compact .sq-hero h2,.sq-compact .sq-tag{display:none}
.sq-compact .sq-trades{margin-top:12px}
/* phone */
@media(max-width:820px){
  body{padding:0 10px}
  #appCALC{padding:10px 0 96px}
  .sq-hero{border-radius:20px}
  .sq-hero-in{flex-direction:column;align-items:stretch;text-align:center;gap:12px;padding:24px 14px 48px}
  .sq-logo{width:116px;height:116px;align-self:center}
  .sq-compact .sq-hero-in{flex-direction:row;align-items:center;text-align:left;gap:12px;padding:14px 14px 40px}
  .sq-compact .sq-logo{width:78px;height:78px}
  .sq-compact .sq-name{flex-direction:column;align-items:flex-start;gap:2px}
  .sq-compact .sq-name,.sq-compact .sq-sub{justify-content:flex-start}
  .sq-compact .sq-gold{font-size:21px}
  .sq-compact .sq-role{font-size:11px;letter-spacing:1.1px}
  .sq-compact .sq-sub{margin-top:6px;gap:6px 8px}
  .sq-compact .sq-app{font-size:12px;letter-spacing:1.1px}
  .sq-compact .sq-tel{font-size:13.5px;padding:6px 12px}
  .sq-compact .sq-trades,.sq-compact .sq-visits,.sq-compact .sq-rev{display:none!important}
  .sq-compact .sq-meta{flex:none;align-self:center}
  .sq-compact .sq-home{width:48px;height:48px;padding:0;justify-content:center;font-size:21px}
  .sq-compact .sq-home span{display:none}
  .sq-fab{right:14px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:23px}
  .zc-head .zc-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .zc-head .zc-acts button{padding:8px 6px;font-size:13px}
  .sq-name,.sq-sub{justify-content:center}
  .sq-gold{font-size:26px}
  .sq-role{font-size:13px;letter-spacing:1.6px}
  .sq-app{font-size:15px;letter-spacing:1.6px}
  .sq-tel{font-size:16px;padding:9px 18px}
  .sq-hero h2{font-size:20px}
  .sq-trades{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sq-trades::-webkit-scrollbar{display:none}
  .sq-meta{align-self:center;align-items:center}
  #appCALC .zc-search{margin:-26px 6px 20px;top:6px}
  .zc-cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .zc-cat{min-height:128px;padding:13px}
  .zc-cat b{font-size:14.5px}
  .zc-cat span:not(.zc-cat-ic){display:none}
  .zc-cards{grid-template-columns:1fr}
  .zc-head{padding:12px}
  .zc-ht h3{font-size:20px}
  .zc-main b{font-size:28px}
}
@media(max-width:380px){.sq-gold{font-size:22px}.sq-role{font-size:12px}}
</style>
</head>

<script>

(function(){

var DATA;

/* ------------------------------------------------------------------ number formatting */
function nf(x,dp){
  if(x==null||!isFinite(x)) return '—';
  dp=dp==null?3:dp;
  var ax=Math.abs(x);
  if(ax!==0 && ax<Math.pow(10,-dp)) return x.toPrecision(3);
  return x.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:dp});
}
function nw(x){ // number inside a working line: up to 6 significant, no grouping
  if(x==null||!isFinite(x)) return '?';

/* ------------------------------------------------------------------ safe expression evaluator (custom calculators) */
var EXPR=(function(){
  var FN={sqrt:Math.sqrt,abs:Math.abs,sin:function(x){return Math.sin(x*Math.PI/180);},cos:function(x){return Math.cos(x*Math.PI/180);},
    tan:function(x){return Math.tan(x*Math.PI/180);},ln:Math.log,log:Math.log10,exp:Math.exp,round:Math.round,ceil:Math.ceil,floor:Math.floor,
    min:Math.min,max:Math.max,pow:Math.pow};
  var CONST={pi:Math.PI,PI:Math.PI,g:9.80665};
  function tokenize(s){
    var t=[],i=0; s=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    while(i<s.length){
      var c=s[i];
      if(/\s/.test(c)){ i++; continue; }
      var m=/^(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)/i.exec(s.slice(i));
      if(m){ t.push({n:+m[1]}); i+=m[1].length; continue; }
      m=/^[A-Za-z_][A-Za-z_0-9]*/.exec(s.slice(i));
      if(m){ t.push({id:m[0]}); i+=m[0].length; continue; }

    }

  }
  function parse(src){
    var t=tokenize(src),p=0;

    function term(){ var n=unary(); while(peek()&&(peek().op==='*'||peek().op==='/')){ var o=t[p++].op; n={o:o,a:n,b:unary()}; } return n; }
    function unary(){ if(eat('-')) return {o:'neg',a:unary()}; if(eat('+')) return unary(); return power(); }
    function power(){ var n=atom(); if(eat('^')) n={o:'^',a:n,b:unary()}; return n; }

      var k=t[p++]; if(!k) throw new Error('Formula ends early');
      if(k.n!=null) return {v:k.n};

      if(k.id){

  }
  function ev(n,vars){
    if(n.v!=null) return n.v;
    if(n.id){ if(vars&&vars[n.id]!=null) return vars[n.id]; if(CONST[n.id]!=null) return CONST[n.id]; throw new Error('Unknown variable '+n.id); }
    if(n.f) return FN[n.f].apply(null,n.args.map(function(a){return ev(a,vars);}));

  }

})();

/* ------------------------------------------------------------------ SVG shape library */
var SH=(function(){

  function svg(inner,vb){ return '<svg class="zc-svg" viewBox="'+(vb||('0 0 '+W+' '+H))+'" xmlns="http://www.w3.org/2000/svg" role="img">'+

/* area of a steel shape in mm² from dimensions in mm — one formula source for every steel calculator */
function shapeArea(sh,p,corner){
  var A,f,w,err=[];
  function pos(k,lab){ if(!(p[k]>0)) err.push((lab||k)+' must be greater than zero'); }
  switch(sh){
    case 'round': pos('d','Diameter'); A=PI/4*p.d*p.d; f='A = π/4 × d²'; w='π/4 × '+nw(p.d)+'²'; break;
    case 'square': pos('a','Side'); A=p.a*p.a; f='A = a²'; w=nw(p.a)+'²'; break;
    case 'rect': case 'flat': pos('a','Width'); pos('b',sh==='flat'?'Thickness':'Height'); A=p.a*p.b; f=sh==='flat'?'A = w × t':'A = b × h'; w=nw(p.a)+' × '+nw(p.b); break;
    case 'hex': pos('a','Across flats'); A=Math.sqrt(3)/2*p.a*p.a; f='A = (√3 / 2) × s²'; w='0.866025 × '+nw(p.a)+'²'; break;
    case 'chs': pos('D','OD'); pos('t','Wall thickness'); if(p.t>=p.D/2) err.push('Wall thickness must be less than OD / 2');
      A=PI/4*(p.D*p.D-Math.pow(p.D-2*p.t,2)); f='A = π/4 × (OD² − ID²),  ID = OD − 2t'; w='π/4 × ('+nw(p.D)+'² − '+nw(p.D-2*p.t)+'²)'; break;
    case 'rhs': pos('a','Height H'); pos('b','Width B'); pos('t','Wall thickness'); if(2*p.t>=Math.min(p.a,p.b)) err.push('2 × t must be less than the smaller side');
      var ro=0,ri=0; corner=corner||'sharp';
      if(corner==='en10210'){ ro=1.5*p.t; ri=p.t; } else if(corner==='en10219'){ ro=p.t<=6?2*p.t:p.t<=10?2.5*p.t:3*p.t; ri=p.t<=6?p.t:p.t<=10?1.5*p.t:2*p.t; }
      if(2*ro>Math.min(p.a,p.b)) err.push('Corner radius too large for this size');
      A=2*p.t*(p.a+p.b-2*p.t)-(4-PI)*(ro*ro-ri*ri);
      f=corner==='sharp'?'A = 2t × (B + H − 2t)  (sharp corners)':'A = 2t × (B + H − 2t) − (4 − π)(ro² − ri²)';
      w='2 × '+nw(p.t)+' × ('+nw(p.b)+' + '+nw(p.a)+' − 2 × '+nw(p.t)+')'+(ro?' − (4 − π) × ('+nw(ro)+'² − '+nw(ri)+'²)':''); break;
    case 'angle': pos('a','Leg a'); pos('b','Leg b'); pos('t','Thickness'); if(p.t>=Math.min(p.a,p.b)) err.push('Thickness must be less than the leg length');
      var r1=p.r1||0,r2=p.r2||0; A=p.t*(p.a+p.b-p.t)+K4*(r1*r1-2*r2*r2);
      f='A = t × (a + b − t)'+(r1||r2?' + (1 − π/4)(r1² − 2 r2²)':''); w=nw(p.t)+' × ('+nw(p.a)+' + '+nw(p.b)+' − '+nw(p.t)+')'+(r1||r2?' + 0.214602 × ('+nw(r1)+'² − 2 × '+nw(r2)+'²)':''); break;
    case 'channel': pos('h','Depth h'); pos('b','Flange width b'); pos('tw','Web tw'); pos('tf','Flange tf'); if(2*p.tf>=p.h) err.push('2 × tf must be less than depth');
      var rc=p.r||0; A=2*p.b*p.tf+(p.h-2*p.tf)*p.tw+2*K4*rc*rc; f='A = 2 b tf + (h − 2 tf) tw'+(rc?' + 2(1 − π/4) r²':'');
      w='2 × '+nw(p.b)+' × '+nw(p.tf)+' + ('+nw(p.h)+' − 2 × '+nw(p.tf)+') × '+nw(p.tw)+(rc?' + 0.429204 × '+nw(rc)+'²':''); break;
    case 'I': pos('h','Depth h'); pos('b','Flange width b'); pos('tw','Web tw'); pos('tf','Flange tf'); if(2*p.tf>=p.h) err.push('2 × tf must be less than depth');
      var r=p.r||0; A=2*p.b*p.tf+(p.h-2*p.tf)*p.tw+4*K4*r*r; f='A = 2 b tf + (h − 2 tf) tw'+(r?' + 4(1 − π/4) r²':'');
      w='2 × '+nw(p.b)+' × '+nw(p.tf)+' + ('+nw(p.h)+' − 2 × '+nw(p.tf)+') × '+nw(p.tw)+(r?' + 0.858407 × '+nw(r)+'²':''); break;
    case 'T': pos('h','Depth h'); pos('b','Flange width b'); pos('tw','Stem tw'); pos('tf','Flange tf'); if(p.tf>=p.h) err.push('tf must be less than depth');
      var rt=p.r||0; A=p.b*p.tf+(p.h-p.tf)*p.tw+2*K4*rt*rt; f='A = b tf + (h − tf) tw'+(rt?' + 2(1 − π/4) r²':''); w=nw(p.b)+' × '+nw(p.tf)+' + ('+nw(p.h)+' − '+nw(p.tf)+') × '+nw(p.tw); break;
    case 'CL': case 'Z': pos('h','Depth h'); pos('b','Flange b'); pos('t','Thickness t'); var c=p.c||0;
      if(c&&c<=p.t) err.push('Lip must be longer than t');
      A=p.t*p.h+2*p.t*(p.b-p.t)+(c>0?2*p.t*(c-p.t):0);
      f='A = t h + 2t (b − t)'+(c>0?' + 2t (c − t)':'')+'  (outside dims, sharp corners)'; w=nw(p.t)+' × '+nw(p.h)+' + 2 × '+nw(p.t)+' × ('+nw(p.b)+' − '+nw(p.t)+')'+(c>0?' + 2 × '+nw(p.t)+' × ('+nw(c)+' − '+nw(p.t)+')':''); break;
    default: err.push('Unknown shape');
  }
  if(A!=null&&!(A>0)&&!err.length) err.push('Dimensions give zero or negative area');
  return {A:A,f:f,w:w,err:err};
}
var SHAPE_OF={round:'round',square:'rect',rect:'rect',flat:'rect',hex:'hex',chs:'chs',rhs:'rhs',angle:'L',channel:'C',I:'I',T:'T',CL:'CL',Z:'Z'};
function shapeParams(sh,p){ // map dims to diagram labels
  switch(sh){ case 'round': return {d:p.d,u:'mm'}; case 'square': return {b:p.a,h:p.a,bl:'a',hl:'a',u:'mm'}; case 'rect': return {b:p.a,h:p.b,u:'mm'};
    case 'flat': return {b:p.a,h:p.b,bl:'w',hl:'t',u:'mm'}; case 'hex': return {s:p.a,u:'mm'}; case 'chs': return {D:p.D,t:p.t,ID:p.D-2*p.t,u:'mm'};
    case 'rhs': return {h:p.a,b:p.b,t:p.t,u:'mm'}; case 'angle': return {a:p.a,b:p.b,t:p.t,u:'mm'}; default: return Object.assign({u:'mm'},p); }
}
/* common tail of every steel weight calculator: kg/m → kg/ft → totals */
function steelTail(R,v,Amm2,label,opts){
  opts=opts||{};
  var kgm=opts.kgm!=null?opts.kgm:Amm2*1e-6*v.rho;
  if(opts.kgm==null) R.step('Weight per metre','w = A × ρ',nw(Amm2)+' mm² × 10⁻⁶ × '+nw(v.rho)+' kg/m³',kgm,'kg/m');
  R.step('Weight per foot','w_ft = w × 0.3048',nw(kgm)+' × 0.3048',kgm*0.3048,'kg/ft');
  var Lm=v.L, n=v.n||1, TL=Lm*n, W=kgm*TL;
  R.step('Total length','ΣL = Nos × L',nw(n)+' × '+nw(Lm)+' m',TL,'m');
  R.step('Total weight','W = w × ΣL',nw(kgm)+' × '+nw(TL),W,'kg');
  R.res('Total weight',W,'mass',{main:true});
  R.res('Weight per metre',kgm,'lmass');
  R.res('Total length',TL,'len',{units:['ft','m','RFT']});
  if(Amm2) R.res('Cross-sectional area',Amm2*1e-6,'area',{units:['mm²','cm²','in²']});
  R.res('Steel volume',Amm2*1e-6*TL,'vol',{units:['m³','CFT','cm³']});
  R.sum=(label||'')+' × '+nf(n,0)+' Nos × '+nf(v._raw.L,3)+' '+v._u.L+' → '+nf(W,3)+' kg';
  return {kgm:kgm,W:W};
}
function densMeta(v){ return {rho:v.rho,custom:v.rhoCustom,name:v.matName,why:v.rhoWhy}; }
/* published/standard mass per m for a selected section, rescaled if density differs from 7850 */
function pubKgm(R,v,s){
  if(s.m==null) return null;
  var k=s.series.kind, std=Math.abs(v.rho-7850)<0.5 && !v.rhoCustom;
  if(std){ R.step('Mass per metre ('+kindLabel(k).toLowerCase()+')','w = table value — '+s.series.std,s.name,s.m,'kg/m'); return s.m; }
  var w=s.m*v.rho/7850; R.step('Mass per metre rescaled to selected density','w = w_table × ρ / 7850',nw(s.m)+' × '+nw(v.rho)+' / 7850',w,'kg/m');
  R.warn('Table mass is for 7850 kg/m³; rescaled to '+nf(v.rho,0)+' kg/m³ ('+(v.rhoCustom?'user-defined':'standard')+' density).');
  return w;
}
function secAreaMm2(s){ return s.A!=null? s.A*100 : null; }
function secShapeParams(s){
  var f=s.fam;
  if(f==='CHS') return {sh:'chs',p:{D:s.D,t:s.t,ID:s.D-2*s.t,u:'mm'}};
  if(f==='RHS') return {sh:'rhs',p:{h:s.h,b:s.b,t:s.t,u:'mm'}};
  if(f==='L') return {sh:'L',p:{a:s.a,b:s.b,t:s.t,u:'mm'}};
  if(f==='T') return {sh:'T',p:{h:s.h,b:s.b,tw:s.tw,tf:s.tf,u:'mm'}};
  if(f==='C') return {sh:'C',p:{h:s.h,b:s.b,tw:s.tw,tf:s.tf,u:'mm'}};
  return {sh:'I',p:{h:s.h,b:s.b,tw:s.tw,tf:s.tf,u:'mm'}};
}
function secDims(s){
  var f=s.fam;
  if(f==='CHS') return {sh:'chs',p:{D:s.D,t:s.t}};
  if(f==='RHS') return {sh:'rhs',p:{a:s.h,b:s.b,t:s.t}};
  if(f==='L') return {sh:'angle',p:{a:s.a,b:s.b,t:s.t,r1:s.r||0}};
  if(f==='T') return {sh:'T',p:{h:s.h,b:s.b,tw:s.tw,tf:s.tf}};
  if(f==='C') return {sh:'channel',p:{h:s.h,b:s.b,tw:s.tw,tf:s.tf,r:s.r||0}};
  return {sh:'I',p:{h:s.h,b:s.b,tw:s.tw,tf:s.tf,r:s.r||0}};
}
/* shared: standard section (published) OR custom geometry */
function sectionOrCustom(R,v,sh,dims,corner,label){
  if(v.sec){
    var s=v.sec, g=secDims(s), a=shapeArea(g.sh,g.p,'sharp');
    R.meta({std:s.series.std,src:[s.series.src,'geom'],kind:kindLabel(s.series.kind),note:s.series.note});
    var kg=pubKgm(R,v,s);
    if(kg==null){ R.err('No verified mass for '+s.name+' — '+kindLabel(s.series.kind)+'.'); return; }
    if(s.A!=null) R.step('Sectional area (table)','A — '+s.series.std,s.name,s.A,'cm²');
    if(!a.err.length){ var kc=a.A*1e-6*v.rho; R.step('Check: plain-geometry mass (no fillet/taper detail)',a.f+' ;  w = A × ρ',a.w+' → '+nw(a.A)+' mm² × 10⁻⁶ × '+nw(v.rho),kc,'kg/m');
      R.note('Plain-geometry check differs from the table by '+nf((kc-kg)/kg*100,1)+'% (root radii, taper, design wall thickness). Totals use the table value.'); }
    steelTail(R,v,s.A!=null?s.A*100:null,s.name,{kgm:kg});
    R.shape=secShapeParams(s);
    return;
  }
  var r=shapeArea(sh,dims,corner); r.err.forEach(function(e){ R.err(e); }); if(r.err.length) return;
  R.meta({std:'Custom section — engineering geometry',src:['geom'],kind:'Calculated'});
  R.step('Cross-sectional area',r.f,r.w,r.A,'mm²');
  steelTail(R,v,r.A,label);
}

def({id:'rebar',cat:'steel',name:'Rebar Weight',sub:'TMT / deformed / plain bars — kg/m, kg/ft, tonnage, length from weight',ic:'rebar',
  kw:'rebar sariya saria steel bar tmt deformed plain round reinforcement d2/162 sutar soot #3 #4 #5 #6 #8 bbs tonnage',
  fl:['w = d² / 162  (kg/m, d in mm)','exact: w = π/4 × d² × 7850 × 10⁻⁶ = d² / 162.2','W = w × L × Nos','L = W / w'],
  inputs:[
    Sel('std','Standard / basis',[['f162','Rule: d² / 162'],['exact','Exact: π/4 · d² · 7850'],['bs','BS 4449 table mass'],['a615','ASTM A615 bar No. (sutar)']],'f162'),
    Lin('d','Bar diameter','mm',12,'mm',{units:['mm','in'],opts:REBAR_D,show:function(v){return v.std!=='a615';}}),
    Sel('bar','Bar No. (sutar)',DATA.rebar.a615.map(function(b){ return [String(b[0]),'#'+b[0]+' — '+b[0]+' sutar ('+nf(b[1]*25.4,1)+' mm)']; }),'4',{show:function(v){return v.std==='a615';}}),
    Sel('mode','Calculate',[['wt','Diameter + length + quantity → weight'],['len','Weight + diameter → length']],'wt'),
    Lin('L','Bar length','ft',40,'m',{units:LEN_ALL,show:function(v){return v.mode==='wt';}}),
    Num('n','Number of bars',1,{int:true,show:function(v){return v.mode==='wt';}}),
    {k:'W',l:'Total weight',dim:'mass',u:'kg',def:1000,base:'kg',show:function(v){return v.mode==='len';}},
    Lin('stock','Stock bar length (for bar count)','ft',40,'m',{units:LEN_ALL,opt:true})
  ],
  calc:function(v,R){
    var kgm,d,src=[],std;
    if(v.std==='a615'){
      var b=DATA.rebar.a615.filter(function(x){return String(x[0])===v.bar;})[0]; d=b[1]*25.4; kgm=b[2]*0.45359237/0.3048;
      std='ASTM A615/A615M Table 1'; src=['a615'];
      R.step('Nominal diameter','d = bar No. / 8 inch','#'+b[0]+' → '+nw(b[1])+' in × 25.4',d,'mm');
      R.step('Nominal weight (published)','w = lb/ft × 1.48816',nw(b[2])+' lb/ft × 1.488164',kgm,'kg/m');
      R.meta({kind:'Published standard table value'});
    } else {
      d=v.d;
      if(!(d>0)) return R.err('Diameter must be greater than zero');
      if(v.std==='f162'){ kgm=d*d/162; std='Rule of thumb d²/162 (from ρ = 7850 kg/m³)'; src=['bs4449'];
        R.step('Weight per metre','w = d² / 162',nw(d)+'² / 162',kgm,'kg/m'); R.meta({kind:'Calculated'});
        R.note('Exact value at 7850 kg/m³ is d² / 162.2 = '+nf(PI/4*d*d*7850e-6,4)+' kg/m (difference 0.1%).'); }
      else if(v.std==='exact'){ kgm=PI/4*d*d*7850e-6; std='Geometry, ρ = 7850 kg/m³ (BS 4449 basis 0.00785 kg/mm²/m)'; src=['bs4449','geom'];
        R.step('Weight per metre','w = π/4 × d² × 7850 × 10⁻⁶','π/4 × '+nw(d)+'² × 0.00785',kgm,'kg/m'); R.meta({kind:'Calculated'}); }
      else { var t=DATA.rebar.bs4449.filter(function(x){return Math.abs(x[0]-d)<1e-6;})[0];
        if(!t) return R.err('No verified BS 4449 table value for Ø'+nf(d,2)+' mm — choose a table size (6, 8, 10, 12, 16, 20, 25, 32, 40, 50) or use a formula basis.');
        kgm=t[1]; std='BS 4449:2005+A3:2016'; src=['bs4449']; R.step('Mass per metre (published)','w = table value','Ø'+nw(d)+' mm',kgm,'kg/m'); R.meta({kind:'Published standard table value'}); }
    }
    R.meta({std:std,src:src,dens:{rho:7850,custom:false,name:'Reinforcing steel',why:'Standard basis of the rebar table/formula'}});
    R.step('Weight per foot','w_ft = w × 0.3048',nw(kgm)+' × 0.3048',kgm*0.3048,'kg/ft');
    var TL,W;
    if(v.mode==='len'){ if(!(v.W>0)) return R.err('Weight must be greater than zero'); W=v.W; TL=W/kgm; R.step('Total length','L = W / w',nw(W)+' / '+nw(kgm),TL,'m'); }
    else { if(!(v.L>0)) return R.err('Bar length must be greater than zero'); TL=v.L*v.n; W=kgm*TL;
      R.step('Total length','ΣL = Nos × L',nw(v.n)+' × '+nw(v.L)+' m',TL,'m'); R.step('Total weight','W = w × ΣL',nw(kgm)+' × '+nw(TL),W,'kg'); }
    R.res(v.mode==='len'?'Total length':'Total weight',v.mode==='len'?TL:W,v.mode==='len'?'len':'mass',{main:true,units:v.mode==='len'?['ft','m','RFT']:null});
    R.res('Weight per metre',kgm,'lmass');
    if(v.mode==='len') R.res('Total weight',W,'mass'); else R.res('Total length',TL,'len',{units:['ft','m','RFT']});
    if(v.stock>0){ var nb=TL/v.stock; R.step('Stock bars','N = ΣL / stock length',nw(TL)+' / '+nw(v.stock),nb,'Nos'); R.res('Stock bars required',Math.ceil(nb-1e-9),'count',{u:'Nos',note:nf(nb,3)+' exact'}); }
    R.res('Nominal diameter',d/1000,'len',{units:['mm','in']});
    R.sum='Rebar Ø'+nf(d,1)+' mm'+(v.mode==='len'? ' — '+nf(W,3)+' kg → '+nf(TL/0.3048,3)+' ft' : ' × '+nf(v._raw.L,3)+' '+v._u.L+' × '+v.n+' Nos → '+nf(W,3)+' kg');
    R.shape={sh:'rebar',p:{d:d,L:v._raw.L,lu:v._u.L,n:v.mode==='wt'?v.n:null}};
  }});

def({id:'plate',cat:'steel',name:'Sheet / Plate Weight (MS, GI, SS, Aluminium)',sub:'L × W × thickness (mm, inch or gauge) × density — per sheet, kg/m², total',ic:'plate',

function pipeCalc(v,R,label){
  if(v.sec){
    var s=v.sec;
    if(s.fam==='CHS'){ var ID=s.D-2*s.t; R.step('Inside diameter','ID = OD − 2t',nw(s.D)+' − 2 × '+nw(s.t),ID,'mm');
      R.res('Inside diameter',ID/1000,'len',{units:['mm','in']}); R.res('Internal volume per metre',PI/4*ID*ID*1e-6,'vol',{units:['litre','US gallon','imp. gallon'],per:'per m'}); }
    sectionOrCustom(R,v,null,null,null,s.name);
    return;
  }
  var sh=v.prof==='chs'?'chs':'rhs', dims=v.prof==='chs'?{D:v.D,t:v.t}:{a:v.a,b:v.prof==='shs'?v.a:v.b,t:v.t};
  if(v.prof==='chs'&&v.D>0&&v.t>0&&v.t<v.D/2){ var id=v.D-2*v.t; R.step('Inside diameter','ID = OD − 2t',nw(v.D)+' − 2 × '+nw(v.t),id,'mm');
    R.res('Inside diameter',id/1000,'len',{units:['mm','in']}); R.res('Internal volume per metre',PI/4*id*id*1e-6,'vol',{units:['litre','US gallon','imp. gallon'],per:'per m'}); }
  if(!(v.L>0)) R.err('Length must be greater than zero');
  sectionOrCustom(R,v,sh,dims,v.corner,(v.prof==='chs'?'Pipe Ø'+nf(v.D,1)+'×'+nf(v.t,2):v.prof.toUpperCase()+' '+nf(v.a,1)+'×'+nf(dims.b,1)+'×'+nf(v.t,2))+' mm');
  if(v.prof!=='chs'&&v.corner!=='sharp') R.meta({std:v.corner==='en10210'?'EN 10210-2 corner radii for calculation':'EN 10219-2 corner radii for calculation',src:[v.corner,'geom']});
  R.shape={sh:sh,p:v.prof==='chs'?{D:v._raw.D,t:v._raw.t,ID:v._raw.D-2*v._raw.t,u:v._u.D}:{h:v._raw.a,b:v.prof==='shs'?v._raw.a:v._raw.b,t:v._raw.t,u:v._u.a}};
}

var FT_UNITS=['ft','in','m','cm','mm','RFT'];

function dimStr(n,a,b,c){ return nw(n)+' × '+nw(a)+(b!=null?' × '+nw(b):'')+(c!=null?' × '+nw(c):''); }
function mixQty(R,dryV,parts,opt){ // dryV in CFT; parts [c, s, a?] ; returns cement bags etc.
  var sum=parts.reduce(function(x,y){return x+y;},0), bagCft=opt.bagKg/opt.cemRho/0.028316846592;
  var cem=dryV*parts[0]/sum, sand=dryV*parts[1]/sum, agg=parts[2]!=null?dryV*parts[2]/sum:null;
  R.step('Cement volume','Vc = Vdry × c / Σ',nw(dryV)+' × '+parts[0]+' / '+nw(sum),cem,'CFT');
  R.step('Volume of one cement bag','Vbag = bag mass / bulk density',nw(opt.bagKg)+' kg / '+nw(opt.cemRho)+' kg/m³ ÷ 0.0283168',bagCft,'CFT');
  R.step('Cement bags','Nc = Vc / Vbag',nw(cem)+' / '+nw(bagCft),cem/bagCft,'bags');
  R.step('Sand','Vs = Vdry × s / Σ',nw(dryV)+' × '+parts[1]+' / '+nw(sum),sand,'CFT');
  if(agg!=null) R.step('Coarse aggregate (crush)','Va = Vdry × a / Σ',nw(dryV)+' × '+parts[2]+' / '+nw(sum),agg,'CFT');
  R.res('Cement',cem/bagCft,'count',{u:'bags ('+nf(opt.bagKg,0)+' kg)',note:nf(cem/bagCft*opt.bagKg,1)+' kg'});
  R.res('Sand',cft2m3(sand),'vol'); if(agg!=null) R.res('Coarse aggregate',cft2m3(agg),'vol');
  return {cem:cem,sand:sand,agg:agg,bags:cem/bagCft};
}

  calc:function(v,R){

def({id:'excav',cat:'civil',name:'Excavation / Earthwork',sub:'Trench / pit volume with side slopes and working space; loose volume',ic:'trench',

def({id:'form',cat:'civil',name:'Formwork / Shuttering',sub:'Contact area for slabs, beams, columns, walls, footings',ic:'form',
  kw:'formwork shuttering centering contact area slab beam column wall footing sft',
  fl:['Slab: L × W + edge perimeter × t','Beam: (b + 2 × d_below slab) × L','Rect column: 2(b + d) × H','Round column: π d H','Wall: 2 × L × H (+ ends)','Footing sides: 2(L + W) × D'],
  inputs:[Sel('el','Element',[['slab','Slab (soffit + edges)'],['beam','Beam (sides + soffit)'],['col','Column — rectangular'],['colc','Column — circular'],['wall','Wall (both faces)'],['foot','Footing (sides)']],'col'),Num('n','Nos',1),
    Lin('L','Length L','ft',20,'ft',{units:FT_UNITS,show:function(v){return /slab|beam|wall|foot/.test(v.el);}}),
    Lin('W','Width W / beam width b / column b','ft',1,'ft',{units:FT_UNITS,show:function(v){return /slab|beam|col$|foot/.test(v.el)||v.el==='col';},lab:function(v){return v.el==='slab'?'Width W':v.el==='beam'?'Beam width b':v.el==='col'?'Column b':'Width W';}}),
    Lin('Dp','Depth: col d / beam depth below slab / footing / slab t','ft',1.5,'ft',{units:FT_UNITS,show:function(v){return v.el!=='colc'&&v.el!=='wall';},lab:function(v){return {slab:'Slab thickness',beam:'Beam depth below slab',col:'Column d',foot:'Footing depth'}[v.el];}}),
    Lin('dia','Diameter','ft',1.5,'ft',{units:FT_UNITS,show:function(v){return v.el==='colc';}}),Lin('H','Height','ft',10,'ft',{units:FT_UNITS,show:function(v){return /col|wall/.test(v.el);}}),
    Lin('tw','Wall thickness (for ends)','ft',0.75,'ft',{units:FT_UNITS,show:function(v){return v.el==='wall';},opt:true,allow0:true}),Sel('edges','Include slab edges',[['y','Yes'],['n','No']],'y',{show:function(v){return v.el==='slab';}})],
  calc:function(v,R){ R.meta({std:'Engineering geometry (contact area)',src:['geom'],kind:'Calculated'}); var A,n=v.n;
    switch(v.el){
      case 'slab': if(!(v.L>0&&v.W>0)) return R.err('L and W required'); A=n*v.L*v.W; R.step('Soffit','Nos × L × W',dimStr(n,v.L,v.W),A,'SFT'); if(v.edges==='y'&&v.Dp>0){ var e=n*2*(v.L+v.W)*v.Dp; R.step('Edges','Nos × 2(L + W) × t',nw(n)+' × 2 × ('+nw(v.L)+' + '+nw(v.W)+') × '+nw(v.Dp),e,'SFT'); A+=e; } break;

      case 'col': if(!(v.W>0&&v.Dp>0&&v.H>0)) return R.err('b, d and H required'); A=n*2*(v.W+v.Dp)*v.H; R.step('Column faces','Nos × 2(b + d) × H',nw(n)+' × 2 × ('+nw(v.W)+' + '+nw(v.Dp)+') × '+nw(v.H),A,'SFT'); break;
      case 'colc': if(!(v.dia>0&&v.H>0)) return R.err('Diameter and H required'); A=n*PI*v.dia*v.H; R.step('Column surface','Nos × π × d × H',nw(n)+' × π × '+nw(v.dia)+' × '+nw(v.H),A,'SFT'); break;
      case 'wall': if(!(v.L>0&&v.H>0)) return R.err('L and H required'); A=n*2*v.L*v.H; R.step('Both faces','Nos × 2 × L × H',nw(n)+' × 2 × '+nw(v.L)+' × '+nw(v.H),A,'SFT'); if(v.tw>0){ var en=n*2*v.tw*v.H; R.step('Ends','Nos × 2 × t × H',nw(n)+' × 2 × '+nw(v.tw)+' × '+nw(v.H),en,'SFT'); A+=en; } break;
      default: if(!(v.L>0&&v.W>0&&v.Dp>0)) return R.err('L, W and D required'); A=n*2*(v.L+v.W)*v.Dp; R.step('Footing sides','Nos × 2(L + W) × D',nw(n)+' × 2 × ('+nw(v.L)+' + '+nw(v.W)+') × '+nw(v.Dp),A,'SFT');
    }

function areaInputs(defL,defW){ return [Sel('am','Area from',[['lw','Room L × W'],['wall','Wall L × H × faces'],['dir','Direct area']],'lw'),
  Lin('L','Length','ft',defL||12,'ft',{units:FT_UNITS,show:function(v){return v.am!=='dir';}}),Lin('W','Width / height','ft',defW||10,'ft',{units:FT_UNITS,show:function(v){return v.am!=='dir';},lab:function(v){return v.am==='wall'?'Height H':'Width W';}}),
  Num('fc','Nos / faces',1,{show:function(v){return v.am!=='dir';}}),{k:'A',l:'Area',dim:'area',u:'SFT',def:120,base:'SFT',show:function(v){return v.am==='dir';}},
  Object.assign({},ROWS_OPEN,{l:'Deductions (openings / fixed items)',show:function(v){return v.am!=='dir';}})]; }
function areaCalc(v,R){ var A; if(v.am==='dir'){ A=v.A; if(!(A>0)) { R.err('Area must be greater than zero'); return null; } R.step('Area','given',nw(A),A,'SFT'); return A; }
  if(!(v.L>0&&v.W>0)){ R.err('L and W must be greater than zero'); return null; } var g=v.fc*v.L*v.W; R.step('Gross area','Nos × L × '+(v.am==='wall'?'H':'W'),dimStr(v.fc,v.L,v.W),g,'SFT');
  var op=openingsRows(R,v.ops,null,'Less deduction'); A=g-op; if(op) R.step('Net area','gross − deductions',nw(g)+' − '+nw(op),A,'SFT'); if(A<=0){ R.err('Deductions exceed the area'); return null; } return A; }
function areaShape(v){ return v.am==='wall'?{sh:'wall',p:{L:v._raw.L,H:v._raw.W,u:v._u.L,ops:v.ops}}:v.am==='lw'?{sh:'box',p:{L:v._raw.L,W:v._raw.W,D:null,u:v._u.L}}:{sh:'none',p:{}}; }

def({id:'tile',cat:'fin',name:'Tile / Flooring / Marble',sub:'Tiles, marble, granite, porcelain — count, wastage, boxes',ic:'tile',
  kw:'tile tiles flooring floor tiles wall tiles marble granite porcelain ceramic boxes pcs 2x2 600x600 cladding',
  fl:['N = A / ((a + j)(b + j))','N_order = N × (1 + wastage%)','Boxes = N_order / tiles per box'],
  inputs:areaInputs().concat([Sel('ts','Tile size',[['600x600','600 × 600 mm'],['600x1200','600 × 1200 mm'],['300x600','300 × 600 mm'],['300x300','300 × 300 mm'],['800x800','800 × 800 mm'],['24x24','24 × 24 in'],['12x12','12 × 12 in'],['16x16','16 × 16 in'],['c','Custom']],'600x600'),
    Lin('ta','Tile length','mm',600,'mm',{units:['mm','in','cm'],show:function(v){return v.ts==='c';}}),Lin('tb','Tile width','mm',600,'mm',{units:['mm','in','cm'],show:function(v){return v.ts==='c';}}),
    Lin('j','Joint width','mm',2,'mm',{units:['mm','in'],allow0:true}),Num('wast','Cutting / breakage wastage %',5,{allow0:true,conv:true,hint:'Depends on layout (straight / diagonal) — specification'}),Num('box','Tiles per box (from supplier, optional)',0,{allow0:true,opt:true})]),
  calc:function(v,R){ var A=areaCalc(v,R); if(A==null) return; R.meta({std:'Engineering geometry',src:['geom','conv'],kind:'Calculated'});
    var a,b; if(v.ts==='c'){ a=v.ta; b=v.tb; } else { var m=v.ts.split('x').map(Number); var f=/^(24|12|16)x/.test(v.ts)?25.4:1; a=m[0]*f; b=m[1]*f; }
    if(!(a>0&&b>0)) return R.err('Tile size required'); var mod=(a+v.j)*(b+v.j)/92903.04; R.step('Tile module incl. joint','(a + j)(b + j)','('+nw(a)+' + '+nw(v.j)+') × ('+nw(b)+' + '+nw(v.j)+') mm ÷ 92,903.04',mod,'SFT');
    var N=A/mod; R.step('Tiles (net)','N = A / module',nw(A)+' / '+nw(mod),N,'Nos'); var Nw=N*(1+v.wast/100); R.step('Tiles incl. wastage','N × (1 + w%)',nw(N)+' × '+nw(1+v.wast/100),Nw,'Nos');
    R.res('Tiles to order',Math.ceil(Nw-1e-9),'count',{u:'Nos',main:true,note:nf(Nw,2)+' exact'}); R.res('Net area',sft2m2(A),'area'); R.res('Area incl. wastage',sft2m2(A*(1+v.wast/100)),'area');
    if(v.box>0){ R.step('Boxes','Nnet / tiles per box',nw(Nw)+' / '+nw(v.box),Nw/v.box,'boxes'); R.res('Boxes',Math.ceil(Nw/v.box-1e-9),'count',{u:'boxes'}); }
    R.sum='Tiles '+nf(a,0)+'×'+nf(b,0)+' mm — '+nf(A,3)+' SFT → '+nf(Math.ceil(Nw),0)+' Nos'; R.shape={sh:'tile',p:{a:a,j:v.j,u:'mm'}}; }});

def({id:'paint',cat:'fin',name:'Paint / Putty / Primer',sub:'Area × coats ÷ coverage (from product TDS) → litres / kg, packs',ic:'wall',

    Num('cov','Coverage per coat (from product TDS)',null,{hint:'Required — take from the product data sheet'}),Sel('covu','Coverage unit',[['sftL','SFT per litre (or per kg)'],['m2L','m² per litre (or per kg)']],'m2L'),
    Num('wast','Wastage %',0,{allow0:true,conv:true}),Num('pack','Pack size (litres or kg, optional)',0,{allow0:true,opt:true})]),
  calc:function(v,R){ var A=areaCalc(v,R); if(A==null) return; if(!(v.cov>0)) return R.err('Enter the coverage per coat from the product TDS (no default is assumed).');

    if(v.covu==='m2L') R.step('Coverage in SFT','m² × 10.7639',nw(v.cov)+' × 10.76391',covS,'SFT per unit');
    var Q=A*v.coats/covS; R.step('Quantity','Q = A × coats / coverage',nw(A)+' × '+nw(v.coats)+' / '+nw(covS),Q,v.pt==='paint'?'litre':'kg'); var Qw=Q*(1+v.wast/100); if(v.wast) R.step('Incl. wastage','Q × (1 + w%)',nw(Q)+' × '+nw(1+v.wast/100),Qw,v.pt==='paint'?'litre':'kg');
    if(v.pt==='paint') R.res('Paint required',Qw*1e-3,'vol',{main:true,units:['litre','US gallon','imp. gallon']}); else R.res('Putty required',Qw,'mass',{main:true,units:['kg']});
    R.res('Painted area',sft2m2(A),'area'); if(v.pack>0) R.res('Packs',Math.ceil(Qw/v.pack-1e-9),'count',{u:'packs of '+nf(v.pack,2)});
    R.sum=(v.pt==='paint'?'Paint ':'Putty ')+nf(A,3)+' SFT × '+v.coats+' coats → '+nf(Qw,3)+(v.pt==='paint'?' L':' kg'); R.shape=areaShape(v); }});

def({id:'wp',cat:'fin',name:'Waterproofing',sub:'Membrane rolls with laps, liquid coats, upturns',ic:'box',
  kw:'waterproofing membrane bitumen app sbs liquid coating roof basement wet area upturn rolls laps',
  fl:['Upturn = perimeter × h','A_total = A + upturn','Rolls = A_total × layers / ((roll W − side lap)(roll L − end lap))','Liquid = A_total × kg/m² × coats'],
  inputs:[Sel('am','Area from',[['lw','L × W'],['dir','Direct area']],'lw'),Lin('L','Length','ft',30,'ft',{units:FT_UNITS,show:function(v){return v.am==='lw';}}),Lin('W','Width','ft',20,'ft',{units:FT_UNITS,show:function(v){return v.am==='lw';}}),
    {k:'A',l:'Area',dim:'area',u:'SFT',def:600,base:'SFT',show:function(v){return v.am==='dir';}},{k:'P',l:'Perimeter for upturn (blank = 2(L + W))',dim:'len',u:'ft',def:null,base:'ft',opt:true,units:FT_UNITS},
    Lin('uh','Upturn height','in',6,'ft',{units:['in','mm','ft'],allow0:true}),Sel('type','System',[['mem','Membrane (rolls)'],['liq','Liquid applied'],['both','Both']],'mem'),
    Lin('rw','Roll width','m',1,'m',{units:['m','ft','mm'],show:function(v){return v.type!=='liq';}}),Lin('rl','Roll length','m',10,'m',{units:['m','ft'],show:function(v){return v.type!=='liq';}}),
    Lin('sl','Side lap','mm',100,'m',{units:['mm','in'],allow0:true,show:function(v){return v.type!=='liq';}}),Lin('el','End lap','mm',150,'m',{units:['mm','in'],allow0:true,show:function(v){return v.type!=='liq';}}),
    Num('ly','Layers',1,{int:true,show:function(v){return v.type!=='liq';}}),{k:'cons',l:'Liquid consumption per coat (TDS)',dim:'amass',u:'kg/m²',def:null,base:'kg/m²',show:function(v){return v.type!=='mem';},hint:'Required — product data sheet'},
    Num('coats','Coats',2,{int:true,show:function(v){return v.type!=='mem';}}),Num('wast','Wastage %',0,{allow0:true,conv:true})],
  calc:function(v,R){ R.meta({std:'Engineering geometry; consumption from product TDS (user)',src:['geom','user'],kind:'Calculated'});
    var A=v.am==='lw'?v.L*v.W:v.A; if(!(A>0)) return R.err('Area must be greater than zero'); if(v.am==='lw') R.step('Plan area','L × W',nw(v.L)+' × '+nw(v.W),A,'SFT');
    var P=v.P>0?v.P:(v.am==='lw'?2*(v.L+v.W):0); if(v.uh>0&&!(P>0)) R.warn('Enter a perimeter to include the upturn.'); var up=P*(v.uh||0); if(up) R.step('Upturn','perimeter × h',nw(P)+' × '+nw(v.uh),up,'SFT');
    var At=(A+up)*(1+v.wast/100); R.step('Total area'+(v.wast?' incl. wastage':''),'(A + upturn)'+(v.wast?' × (1 + w%)':''),'('+nw(A)+' + '+nw(up)+')'+(v.wast?' × '+nw(1+v.wast/100):''),At,'SFT');
    R.res('Waterproofing area',sft2m2(At),'area',{main:true}); var Am2=sft2m2(At);
    if(v.type!=='liq'){ var eff=(v.rw-v.sl)*(v.rl-v.el); if(!(eff>0)) return R.err('Laps exceed the roll size'); R.step('Effective roll area','(W − side lap)(L − end lap)','('+nw(v.rw)+' − '+nw(v.sl)+') × ('+nw(v.rl)+' − '+nw(v.el)+') m',eff,'m²');
      var rolls=Am2*v.ly/eff; R.step('Rolls','A × layers / effective area',nw(Am2)+' × '+nw(v.ly)+' / '+nw(eff),rolls,'rolls'); R.res('Membrane rolls',Math.ceil(rolls-1e-9),'count',{u:'rolls',note:nf(rolls,2)+' exact'}); }
    if(v.type!=='mem'){ if(!(v.cons>0)) return R.err('Enter the liquid consumption per coat from the product TDS.'); var kg=Am2*v.cons*v.coats; R.step('Liquid material','A × kg/m² × coats',nw(Am2)+' × '+nw(v.cons)+' × '+nw(v.coats),kg,'kg'); R.res('Liquid waterproofing',kg,'mass',{units:['kg']}); }
    R.sum='Waterproofing '+nf(At,3)+' SFT'; R.shape={sh:'box',p:{L:v._raw.L,W:v._raw.W,u:v._u.L}}; }});

def({id:'skirt',cat:'fin',name:'Skirting / Coving / Cornice',sub:'Running length from room perimeter less door openings',ic:'grid',kw:'skirting coving cornice moulding perimeter rft running feet',
  fl:['RFT = Nos × 2(L + W) − doors','order = RFT × (1 + w%)'],
  inputs:[Num('n','Nos (rooms)',1),Lin('L','Room length','ft',12,'ft',{units:FT_UNITS}),Lin('W','Room width','ft',10,'ft',{units:FT_UNITS}),{type:'rows',k:'dr',l:'Door / opening widths to deduct',cols:[['n','Nos'],['w','Width']],u:'ft',base:'ft'},
    Lin('h','Skirting height (for SFT)','in',4,'ft',{units:['in','mm'],opt:true,allow0:true}),Num('wast','Wastage %',5,{allow0:true,conv:true})],
  calc:function(v,R){ if(!(v.L>0&&v.W>0)) return R.err('L and W required'); R.meta({std:'Engineering geometry',src:['geom','conv'],kind:'Calculated'});
    var P=v.n*2*(v.L+v.W); R.step('Perimeter','Nos × 2(L + W)',nw(v.n)+' × 2 × ('+nw(v.L)+' + '+nw(v.W)+')',P,'RFT'); var d=0; (v.dr||[]).forEach(function(o,i){ if(o.n>0&&o.w>0){ d+=o.n*o.w; R.step('Less door '+(i+1),'−(Nos × W)','−('+nw(o.n)+' × '+nw(o.w)+')',-o.n*o.w,'RFT'); } });
    var Lr=(P-d)*(1+v.wast/100); R.step('Running length to order','(P − doors) × (1 + w%)','('+nw(P)+' − '+nw(d)+') × '+nw(1+v.wast/100),Lr,'RFT'); R.res('Skirting length',ft2m(Lr),'len',{main:true,units:['RFT','m']});
    if(v.h>0) R.res('Skirting area',sft2m2(Lr*v.h),'area'); R.sum='Skirting → '+nf(Lr,3)+' RFT'; R.shape={sh:'grid',p:{}}; }});

def({id:'board',cat:'fin',name:'Boards: Gypsum / Cement / Ceiling / Cladding',sub:'Area ÷ sheet size with wastage → sheets',ic:'grid',
  kw:'gypsum board cement board false ceiling ceiling tiles cladding panel sheets drywall partition',fl:['Sheets = A × (1 + w%) / (sheet L × W)'],
  inputs:areaInputs(20,15).concat([Lin('sl','Sheet length (supplier)','ft',8,'ft',{units:['ft','mm','m']}),Lin('sw','Sheet width (supplier)','ft',4,'ft',{units:['ft','mm','m']}),Num('sides','Faces boarded',1,{int:true}),Num('wast','Wastage %',10,{allow0:true,conv:true})]),
  calc:function(v,R){ var A=areaCalc(v,R); if(A==null) return; if(!(v.sl>0&&v.sw>0)) return R.err('Sheet size required'); R.meta({std:'Engineering geometry',src:['geom','conv'],kind:'Calculated'});
    var At=A*v.sides*(1+v.wast/100); R.step('Board area','A × faces × (1 + w%)',nw(A)+' × '+nw(v.sides)+' × '+nw(1+v.wast/100),At,'SFT'); var sa=v.sl*v.sw; var N=At/sa; R.step('Sheets','A / (L × W)',nw(At)+' / ('+nw(v.sl)+' × '+nw(v.sw)+')',N,'sheets');
    R.res('Sheets',Math.ceil(N-1e-9),'count',{u:'sheets',main:true,note:nf(N,2)+' exact'}); R.res('Board area incl. wastage',sft2m2(At),'area'); R.sum='Boards '+nf(A,3)+' SFT → '+Math.ceil(N)+' sheets'; R.shape=areaShape(v); }});

def({id:'grout',cat:'fin',name:'Tile Grout / Adhesive',sub:'Grout from joint geometry; adhesive from consumption',ic:'tile',kw:'grout tile grout joint filler adhesive tile adhesive thinset bond',
  fl:['Grout kg/m² = (a + b)/(a × b) × j × d × ρ','Adhesive = A × kg/m²'],
  inputs:[{k:'A',l:'Tiled area',dim:'area',u:'SFT',def:500,base:'m²'},Lin('a','Tile length a','mm',600,'mm',{units:['mm','in']}),Lin('b','Tile width b','mm',600,'mm',{units:['mm','in']}),Lin('j','Joint width','mm',3,'mm',{units:['mm','in']}),Lin('d','Joint depth (tile thickness)','mm',10,'mm',{units:['mm','in']}),
    {k:'rho',l:'Grout density (product TDS)',dim:'dens',u:'kg/m³',def:null,base:'kg/m³',opt:true,hint:'Required for grout — product data sheet'},{k:'adh',l:'Adhesive consumption (TDS, optional)',dim:'amass',u:'kg/m²',def:null,base:'kg/m²',opt:true},Num('wast','Wastage %',0,{allow0:true,conv:true})],
  calc:function(v,R){ if(!(v.A>0&&v.a>0&&v.b>0&&v.j>0&&v.d>0)) return R.err('All dimensions required'); R.meta({std:'Engineering geometry; densities from product TDS (user)',src:['geom','user'],kind:'Calculated'}); var wf=1+v.wast/100; var any=false;
    if(v.rho>0){ var kgm2=(v.a+v.b)/(v.a*v.b)*v.j*v.d*v.rho/1000; R.step('Grout per m²','(a + b)/(a × b) × j × d × ρ','('+nw(v.a)+' + '+nw(v.b)+')/('+nw(v.a)+' × '+nw(v.b)+') × '+nw(v.j)+' × '+nw(v.d)+' × '+nw(v.rho)+' / 1000',kgm2,'kg/m²');
      var g=kgm2*v.A*wf; R.step('Grout','kg/m² × A'+(v.wast?' × (1 + w%)':''),nw(kgm2)+' × '+nw(v.A)+(v.wast?' × '+nw(wf):''),g,'kg'); R.res('Grout',g,'mass',{main:true,units:['kg']}); any=true; } else R.warn('Grout: enter the grout density from the product TDS.');
    if(v.adh>0){ var ad=v.A*v.adh*wf; R.step('Adhesive','A × kg/m²',nw(v.A)+' × '+nw(v.adh)+(v.wast?' × '+nw(wf):''),ad,'kg'); R.res('Adhesive',ad,'mass',{main:!any,units:['kg']}); any=true; }
    if(!any) R.err('Enter grout density and/or adhesive consumption from the product data sheet.'); R.sum='Grout/adhesive for '+nf(v._raw.A,3)+' '+v._u.A; R.shape={sh:'tile',p:{a:v.a,j:v.j}}; }});

def({id:'sealant',cat:'fin',name:'Sealant',sub:'Joint width × depth × length → litres and cartridges',ic:'grid',kw:'sealant silicone polysulphide mastic joint sealant cartridge caulk expansion joint',
  fl:['V = w × d × L','cartridges = V / cartridge volume'],
  inputs:[Lin('w','Joint width','mm',10,'mm',{units:['mm','in']}),Lin('d','Joint depth','mm',8,'mm',{units:['mm','in']}),Lin('L','Joint length','ft',100,'m',{units:FT_UNITS}),{k:'cart',l:'Cartridge / sausage volume (product)',dim:'vol',u:'mL',def:300,base:'litre',conv:true},Num('wast','Wastage %',10,{allow0:true,conv:true})],
  calc:function(v,R){ if(!(v.w>0&&v.d>0&&v.L>0)) return R.err('Width, depth and length required'); R.meta({std:'Engineering geometry',src:['geom','conv'],kind:'Calculated'});
    var Vl=v.w*v.d*v.L*1e-3*(1+v.wast/100); R.step('Sealant volume','w × d × L × (1 + w%)',nw(v.w)+' × '+nw(v.d)+' mm² × '+nw(v.L)+' m × 10⁻³ × '+nw(1+v.wast/100),Vl,'litre');
    R.res('Sealant',Vl*1e-3,'vol',{main:true,units:['litre','mL']}); if(v.cart>0){ var c=Vl/v.cart; R.step('Cartridges','V / cartridge',nw(Vl)+' / '+nw(v.cart),c,'Nos'); R.res('Cartridges',Math.ceil(c-1e-9),'count',{u:'Nos'}); }
    R.sum='Sealant '+nf(v.w,0)+'×'+nf(v.d,0)+' mm × '+nf(v._raw.L,3)+' '+v._u.L; R.shape={sh:'grid',p:{}}; }});

def({id:'pipevol',cat:'mep',name:'Pipe Volume / Weight (any material)',sub:'ASME, EN 10255, PVC schedules or custom — ID, water volume, weight',ic:'chs',
  kw:'pipe volume water volume pipe weight ppr hdpe pvc upvc cpvc copper stainless ductile iron gi schedule sch 40 sch 80 internal volume litres per metre',
  fl:['ID = OD − 2t','Internal volume = π/4 ID² × L','A = π/4(OD² − ID²),  w = A × ρ'],
  inputs:[{type:'sec',k:'sec',l:'Standard / size',fams:['CHS'],custom:true,def:['ASME-40','NPS 2" (DN 50) Sch 40']},
    Lin('D','Outside diameter OD','mm',63,'mm',{units:['mm','in'],show:function(v){return !v.sec;}}),Lin('t','Wall thickness','mm',5.8,'mm',{units:['mm','in'],gauge:{std:'swg',auto:false},show:function(v){return !v.sec;}}),
    Lin('L','Length','ft',100,'m',{units:LEN_ALL}),Num('n','Quantity (runs)',1,{int:true}),{type:'mat',k:'mat',def:'ms',grp:null}],
  calc:function(v,R){ var D=v.sec?v.sec.D:v.D, t=v.sec?v.sec.t:v.t; if(!(D>0&&t>0&&t<D/2)) return R.err('OD and wall thickness required (t < OD/2)'); if(!(v.L>0)) return R.err('Length required');
    R.meta({std:v.sec?v.sec.series.std:'Custom pipe — geometry',src:v.sec?[v.sec.series.src,'geom']:['geom'],kind:'Calculated (geometry)',dens:densMeta(v)});
    var ID=D-2*t, Ai=PI/4*ID*ID, TL=v.L*v.n; R.step('Inside diameter','ID = OD − 2t',nw(D)+' − 2 × '+nw(t),ID,'mm'); R.step('Bore area','Ai = π/4 × ID²','π/4 × '+nw(ID)+'²',Ai,'mm²');
    R.step('Internal volume per metre','Ai × 1 m',nw(Ai)+' × 10⁻⁶ × 1000',Ai*1e-3,'litre/m'); R.step('Total length','Nos × L',nw(v.n)+' × '+nw(v.L),TL,'m'); var Vw=Ai*1e-6*TL; R.step('Total internal volume','Ai × ΣL',nw(Ai)+' × 10⁻⁶ × '+nw(TL),Vw,'m³');
    R.res('Water / internal volume',Vw,'vol',{main:true,units:['litre','US gallon','imp. gallon','m³','CFT']}); R.res('Volume per metre',Ai*1e-6,'vol',{units:['litre'],per:'per m'}); R.res('Inside diameter',ID/1000,'len',{units:['mm','in']}); R.res('Total length',TL,'len',{units:['ft','m','RFT']});
    if(v.rho>0){ var As=PI/4*(D*D-ID*ID), kgm=As*1e-6*v.rho; R.step('Wall area','A = π/4(OD² − ID²)','π/4 × ('+nw(D)+'² − '+nw(ID)+'²)',As,'mm²'); R.step('Weight per metre','w = A × ρ',nw(As)+' × 10⁻⁶ × '+nw(v.rho),kgm,'kg/m');
      R.step('Total pipe weight','w × ΣL',nw(kgm)+' × '+nw(TL),kgm*TL,'kg'); R.res('Pipe weight (empty)',kgm*TL,'mass'); R.res('Weight per metre',kgm,'lmass'); R.res('Weight full of water',kgm*TL+Vw*1000,'mass');
      if(v.sec&&v.sec.m!=null&&Math.abs(v.rho-7850)<1) R.note('Table value for this size: '+nf(v.sec.m,2)+' kg/m ('+kindLabel(v.sec.series.kind)+').'); }
    else R.warn('Pipe weight: no verified density for '+(v.matName||'this material')+' — enter the density from the manufacturer TDS.');
    R.sum='Pipe '+(v.sec?v.sec.name:'Ø'+nf(D,1)+'×'+nf(t,2)+' mm')+' × '+nf(TL,3)+' m → '+nf(Vw*1000,2)+' L'; R.shape={sh:'chs',p:{D:D,t:t,ID:ID,u:'mm'}}; }});

def({id:'tank',cat:'mep',name:'Tank / Water Volume',sub:'Rectangular, vertical or horizontal cylindrical (part-filled) tanks',ic:'cyl',
  kw:'tank water tank volume capacity litres gallons overhead underground cylindrical horizontal cylinder sump',
  fl:['Rect: V = L × W × H','Vertical cyl: V = π/4 D² H','Horizontal cyl, fill h: V = L × [r² acos((r−h)/r) − (r−h)√(2rh − h²)]'],
  inputs:[Sel('sh','Tank shape',[['rect','Rectangular'],['vcyl','Vertical cylinder'],['hcyl','Horizontal cylinder']],'rect'),Lin('L','Length','ft',10,'m',{units:FT_UNITS,show:function(v){return v.sh!=='vcyl';}}),
    Lin('W','Width','ft',8,'m',{units:FT_UNITS,show:function(v){return v.sh==='rect';}}),Lin('D','Diameter','ft',6,'m',{units:FT_UNITS,show:function(v){return v.sh!=='rect';}}),
    Lin('H','Water depth / height','ft',6,'m',{units:FT_UNITS,show:function(v){return v.sh!=='hcyl';}}),Lin('h','Fill height','ft',3,'m',{units:FT_UNITS,show:function(v){return v.sh==='hcyl';}}),Num('n','Nos',1)],
  calc:function(v,R){ R.meta({std:'Engineering geometry',src:['geom'],kind:'Calculated'}); var V;
    if(v.sh==='rect'){ if(!(v.L>0&&v.W>0&&v.H>0)) return R.err('L, W, H required'); V=v.n*v.L*v.W*v.H; R.step('Volume','Nos × L × W × H',dimStr(v.n,v.L,v.W,v.H)+' m',V,'m³'); R.shape={sh:'box',p:{L:v._raw.L,W:v._raw.W,D:v._raw.H,dl:'H',u:v._u.L,n:v.n}}; }
    else if(v.sh==='vcyl'){ if(!(v.D>0&&v.H>0)) return R.err('D and H required'); V=v.n*PI/4*v.D*v.D*v.H; R.step('Volume','Nos × π/4 × D² × H',nw(v.n)+' × π/4 × '+nw(v.D)+'² × '+nw(v.H),V,'m³'); R.shape={sh:'cyl',p:{D:v._raw.D,H:v._raw.H,u:v._u.D}}; }
    else { if(!(v.D>0&&v.L>0)) return R.err('D and L required'); if(!(v.h>0&&v.h<=v.D)) return R.err('Fill height must be between 0 and D'); var r=v.D/2,h=v.h, A=r*r*Math.acos((r-h)/r)-(r-h)*Math.sqrt(2*r*h-h*h);
      R.step('Wetted segment area','r² acos((r − h)/r) − (r − h)√(2rh − h²)','r = '+nw(r)+', h = '+nw(h),A,'m²'); V=v.n*A*v.L; R.step('Volume','Nos × A × L',nw(v.n)+' × '+nw(A)+' × '+nw(v.L),V,'m³');
      R.res('Full capacity',v.n*PI/4*v.D*v.D*v.L,'vol',{units:SHOW.liq}); R.shape={sh:'hcyl',p:{D:v._raw.D,h:v._raw.h,L:v._raw.L,u:v._u.D}}; }
    R.res('Water volume',V,'vol',{main:true,units:SHOW.liq}); R.res('Water mass (fresh water, 1000 kg/m³)',V*1000,'mass'); R.sum='Tank ('+v.sh+') → '+nf(V*1000,1)+' L'; }});

def({id:'flow',cat:'mep',name:'Flow & Velocity',sub:'Flow ↔ velocity in a pipe or duct bore; CFM, L/s, m³/h, gpm',ic:'chs',kw:'flow velocity gpm lps m3/h cfm pipe flow speed hydraulic duct velocity fpm',
  fl:['Q = v × A','A = π/4 × ID²  (round)  or  W × H (rect)'],
  inputs:[Sel('mode','Find',[['v','Velocity from flow'],['q','Flow from velocity']],'v'),Sel('sh','Bore',[['round','Round (pipe / duct)'],['rect','Rectangular duct']],'round'),
    Lin('d','Inside diameter','mm',50,'m',{units:['mm','in'],show:function(v){return v.sh==='round';}}),Lin('W','Duct width','mm',600,'m',{units:['mm','in'],show:function(v){return v.sh==='rect';}}),Lin('H','Duct height','mm',400,'m',{units:['mm','in'],show:function(v){return v.sh==='rect';}}),
    {k:'Q',l:'Flow rate',dim:'flow',u:'L/s',def:2,base:'m³/s',show:function(v){return v.mode==='v';}},{k:'V',l:'Velocity',dim:'vel',u:'m/s',def:1.5,base:'m/s',show:function(v){return v.mode==='q';}}],
  calc:function(v,R){ R.meta({std:'Continuity equation Q = v·A (exact)',src:['geom'],kind:'Calculated'}); var A=v.sh==='round'?PI/4*v.d*v.d:v.W*v.H; if(!(A>0)) return R.err('Bore size required');
    R.step('Flow area',v.sh==='round'?'A = π/4 × d²':'A = W × H',v.sh==='round'?'π/4 × '+nw(v.d)+'²':nw(v.W)+' × '+nw(v.H),A,'m²');
    if(v.mode==='v'){ if(!(v.Q>0)) return R.err('Flow required'); var vel=v.Q/A; R.step('Velocity','v = Q / A',nw(v.Q)+' / '+nw(A),vel,'m/s'); R.res('Velocity',vel,'vel',{main:true}); R.res('Flow',v.Q,'flow'); }
    else { if(!(v.V>0)) return R.err('Velocity required'); var Q=v.V*A; R.step('Flow','Q = v × A',nw(v.V)+' × '+nw(A),Q,'m³/s'); R.res('Flow rate',Q,'flow',{main:true}); }
    R.sum='Flow/velocity'; R.shape=v.sh==='round'?{sh:'chs',p:{D:v._raw.d,t:null,ID:null,u:v._u.d}}:{sh:'duct',p:{W:v._raw.W,H:v._raw.H,u:v._u.W}}; }});

def({id:'runs',cat:'mep',name:'Pipe / Conduit / Cable Length Takeoff',sub:'Σ (Nos × length) + wastage — pipes, drains, conduits, cables, trays',ic:'grid',
  kw:'pipe length conduit length cable length drain pipe takeoff running length rft wire quantity fittings tray length',fl:['ΣL = Σ(Nos × L)','order = ΣL × (1 + w%)'],
  inputs:[{type:'rows',k:'runs',l:'Runs (Nos × length)',cols:[['n','Nos'],['l','Length']],u:'ft',base:'ft',def:[{n:1,l:50},{n:4,l:12}]},Num('drop','Extra per run (drops / terminations) — optional',0,{allow0:true,opt:true,hint:'Length in the same unit as the runs'}),Num('wast','Wastage %',5,{allow0:true,conv:true}),Lin('stk','Stock / coil length (optional)','ft',0,'ft',{units:['ft','m'],opt:true,allow0:true})],
  calc:function(v,R){ R.meta({std:'Engineering geometry',src:['geom','conv'],kind:'Calculated'}); var T=0,nr=0; (v.runs||[]).forEach(function(o,i){ if(o.n>0&&o.l>0){ T+=o.n*o.l; nr+=o.n; R.step('Run '+(i+1),'Nos × L',nw(o.n)+' × '+nw(o.l),o.n*o.l,'RFT'); } });
    if(!T) return R.err('Enter at least one run'); var ex=(v.drop||0)*nr*conv(1,'len',v._u.runs||'ft','ft'); if(ex) { R.step('Drops / terminations','Σ Nos × extra',nw(nr)+' × '+nw(v.drop),ex,'RFT'); T+=ex; }
    var Tw=T*(1+v.wast/100); R.step('Total incl. wastage','ΣL × (1 + w%)',nw(T)+' × '+nw(1+v.wast/100),Tw,'RFT'); R.res('Total length',ft2m(Tw),'len',{main:true,units:['RFT','m']});
    if(v.stk>0) R.res('Stock lengths / coils',Math.ceil(Tw/v.stk-1e-9),'count',{u:'Nos'}); R.sum='Takeoff → '+nf(Tw,3)+' RFT'; R.shape={sh:'grid',p:{}}; }});

def({id:'insul',cat:'mep',name:'Insulation',sub:'Pipe insulation volume & jacketing area; duct / flat insulation area',ic:'insul',
  kw:'insulation pipe insulation lagging armaflex nitrile rockwool glasswool duct insulation cladding jacketing',
  fl:['Pipe: V = π/4 [(D + 2ti)² − D²] × L','Jacket area = π (D + 2ti) × L','Flat: A × thickness'],
  inputs:[Sel('ty','Type',[['pipe','Pipe insulation'],['flat','Duct / flat surface']],'pipe'),Lin('D','Pipe OD','mm',60.3,'m',{units:['mm','in'],show:function(v){return v.ty==='pipe';}}),Lin('ti','Insulation thickness','mm',25,'m',{units:['mm','in']}),

def({id:'eload',cat:'mep',name:'Electrical Load (kW / kVA / A)',sub:'1-phase and 3-phase: current ↔ power, power factor, kVAR',ic:'cable',
  kw:'electrical load kw kva amp ampere current power factor 3 phase single phase kvar watt volt',fl:['1φ: S = V × I','3φ: S = √3 × V_L × I','P = S × pf','Q = S × sin(acos pf)'],
  inputs:[Sel('ph','System',[['1','Single phase'],['3','Three phase (line voltage)']],'3'),Sel('mode','Find',[['i','Current from power'],['p','Power from current']],'i'),Num('V','Voltage (V)',400),Num('pf','Power factor',0.85),
    {k:'P',l:'Active power',dim:'power',u:'kW',def:50,base:'W',show:function(v){return v.mode==='i';}},Num('I','Current (A)',80,{show:function(v){return v.mode==='p';}})],
  calc:function(v,R){ R.meta({std:'AC power relations (IEC 60050) — exact formulas',src:['geom'],kind:'Calculated'}); if(!(v.V>0)) return R.err('Voltage required'); if(!(v.pf>0&&v.pf<=1)) return R.err('Power factor must be between 0 and 1');
    var k=v.ph==='3'?Math.sqrt(3):1, S,I,P; if(v.mode==='i'){ if(!(v.P>0)) return R.err('Power required'); P=v.P; S=P/v.pf; I=S/(k*v.V); R.step('Apparent power','S = P / pf',nw(P)+' / '+nw(v.pf),S,'VA'); R.step('Current',v.ph==='3'?'I = S / (√3 × V)':'I = S / V',nw(S)+' / ('+(v.ph==='3'?'1.732051 × ':'')+nw(v.V)+')',I,'A'); }
    else { if(!(v.I>0)) return R.err('Current required'); I=v.I; S=k*v.V*I; P=S*v.pf; R.step('Apparent power',v.ph==='3'?'S = √3 × V × I':'S = V × I',(v.ph==='3'?'1.732051 × ':'')+nw(v.V)+' × '+nw(I),S,'VA'); R.step('Active power','P = S × pf',nw(S)+' × '+nw(v.pf),P,'W'); }
    var Q=S*Math.sin(Math.acos(v.pf)); R.step('Reactive power','Q = S × sin(acos pf)',nw(S)+' × '+nw(Math.sin(Math.acos(v.pf))),Q,'VAR');
    R.res(v.mode==='i'?'Current':'Active power',v.mode==='i'?I:P,v.mode==='i'?'count':'power',{main:true,u:v.mode==='i'?'A':null}); R.res('Apparent power',S/1000,'count',{u:'kVA'}); R.res('Active power',P/1000,'count',{u:'kW'}); R.res('Reactive power',Q/1000,'count',{u:'kVAR'}); if(v.mode==='p') R.res('Current',I,'count',{u:'A'});
    R.sum=(v.ph==='3'?'3φ ':'1φ ')+nf(P/1000,3)+' kW @ '+v.V+' V → '+nf(I,2)+' A'; R.shape={sh:'cable',p:{n:v.ph==='3'?3:2,lab:v.ph==='3'?'3-phase':'1-phase'}}; }});

def({id:'ohm',cat:'mep',name:"Ohm's Law & Power",sub:'Any two of V, I, R → the rest and power',ic:'cable',kw:'ohm ohms law voltage current resistance power watts',fl:['V = I × R','P = V × I = I² R = V² / R'],
  inputs:[Sel('k','Known values',[['vi','V and I'],['vr','V and R'],['ir','I and R']],'vi'),Num('V','Voltage V',230,{show:function(v){return v.k!=='ir';}}),Num('I','Current I (A)',10,{show:function(v){return v.k!=='vr';}}),Num('R','Resistance R (Ω)',23,{show:function(v){return v.k!=='vi';}})],
  calc:function(v,R){ R.meta({std:"Ohm's law (exact)",src:['geom'],kind:'Calculated'}); var V=v.V,I=v.I,Rr=v.R;
    if(v.k==='vi'){ if(!(V>0&&I>0)) return R.err('V and I required'); Rr=V/I; R.step('Resistance','R = V / I',nw(V)+' / '+nw(I),Rr,'Ω'); }
    if(v.k==='vr'){ if(!(V>0&&Rr>0)) return R.err('V and R required'); I=V/Rr; R.step('Current','I = V / R',nw(V)+' / '+nw(Rr),I,'A'); }
    if(v.k==='ir'){ if(!(I>0&&Rr>0)) return R.err('I and R required'); V=I*Rr; R.step('Voltage','V = I × R',nw(I)+' × '+nw(Rr),V,'V'); }
    R.step('Power','P = V × I',nw(V)+' × '+nw(I),V*I,'W'); R.res('Power',V*I,'power',{main:true,units:['W','kW']}); R.res('Voltage',V,'count',{u:'V'}); R.res('Current',I,'count',{u:'A'}); R.res('Resistance',Rr,'count',{u:'Ω'}); R.sum='V='+nf(V,2)+' I='+nf(I,3)+' R='+nf(Rr,3); R.shape={sh:'none',p:{}}; }});

def({id:'cable',cat:'mep',name:'Cable Weight / Length',sub:'Conductor mass by size, cores, Cu / Al; overall weight from maker data',ic:'cable',

  calc:function(v,R){ var A=+v.sz, rho=v.cm==='cu'?MAT.cu.rho:MAT.alc.rho, TL=v.L*v.n; if(!(v.L>0)) return R.err('Length required');

    var row=DATA.iec60228.filter(function(r){return r[0]===A;})[0], rr=row?(v.cm==='cu'?row[1]:row[2]):null; if(rr) R.res('Max DC resistance per core @20 °C (IEC 60228 cl.2)',rr,'count',{u:'Ω/km'}); else if(v.cm==='al') R.note('IEC 60228 has no Class 2 aluminium value below 10 mm².');

def({id:'vdrop',cat:'mep',name:'Voltage Drop (DC resistance estimate)',sub:'IEC 60228 max resistance at 20 °C — estimate only, reactance excluded',ic:'cable',kw:'voltage drop cable sizing resistance ohm per km drop percent',
  fl:['1φ: ΔV = 2 × I × R × L','3φ: ΔV = √3 × I × R × L','R = IEC 60228 Ω/km at 20 °C'],

def({id:'awg',cat:'mep',name:'AWG ↔ mm²',sub:'American Wire Gauge diameter & area (ASTM B258) and nearest gauge',ic:'cable',kw:'awg wire gauge mm2 american wire gauge conversion b&s',fl:['d = 0.127 mm × 92^((36 − n)/39)','A = π/4 × d²'],
  inputs:[Sel('mode','Convert',[['a2m','AWG → mm²'],['m2a','mm² → nearest AWG']],'a2m'),Sel('g','AWG',DATA.awg.map(function(r){return [r[0],'AWG '+r[0]];}),'12',{show:function(v){return v.mode==='a2m';}}),Num('A','Area (mm²)',2.5,{show:function(v){return v.mode==='m2a';}})],

      R.step('Nearest AWG','min |ln(A_awg / A)|',nw(v.A)+' mm²',best[2],'mm²'); R.res('Nearest AWG',0,'count',{u:'AWG '+best[0],main:true,note:nf(best[2],3)+' mm²',txt:true}); if(up) R.res('Smallest AWG ≥ area',0,'count',{u:'AWG '+up[0],note:nf(up[2],3)+' mm²',txt:true}); R.sum=nf(v.A,2)+' mm² ≈ AWG '+best[0]; }

def({id:'tray',cat:'mep',name:'Cable Tray / Trunking Weight',sub:'Developed sheet width × thickness × density (+ zinc, covers)',ic:'C',kw:'cable tray trunking ladder perforated tray gi tray weight kg per metre cover',

def({id:'duct',cat:'mep',name:'HVAC Duct: Area / Weight / Volume',sub:'Rectangular or round duct — sheet area, GI weight, air volume, insulation',ic:'duct',
  kw:'duct ductwork hvac gi duct sheet metal gauge duct area sft duct weight insulation air volume rectangular round',
  fl:['Rect area = 2(W + H) × L','Round area = π D L','Weight = area × t × ρ (+ zinc) × (1 + seams%)','Air volume = W H L  or  π/4 D² L'],
  inputs:[Sel('sh','Duct',[['rect','Rectangular'],['round','Round']],'rect'),Lin('W','Width W','in',24,'m',{units:['in','mm'],show:function(v){return v.sh==='rect';}}),Lin('H','Height H','in',12,'m',{units:['in','mm'],show:function(v){return v.sh==='rect';}}),

def({id:'matwt',cat:'civil',name:'Material Weight (CFT ↔ kg)',sub:'Concrete, RCC, brick masonry, mortar, cement, sand, steel, water — volume ↔ weight',ic:'box',

  fl:['W = V × ρ','V = W / ρ','kg per CFT = ρ × 0.0283168'],
  inputs:[{type:'mat',k:'mat',def:'rcc',grp:null},Sel('mode','Calculate',[['v2w','Volume → weight'],['w2v','Weight → volume']],'v2w'),
    {k:'V',l:'Volume',dim:'vol',u:'CFT',def:100,base:'m³',units:VOL_UNITS,show:function(v){return v.mode==='v2w';}},
    {k:'W',l:'Weight',dim:'mass',u:'kg',def:1000,base:'kg',show:function(v){return v.mode==='w2v';}}],
  calc:function(v,R){ if(!(v.rho>0)) return R.err('No verified density for '+(v.matName||'this material')+' — enter the density (site test / supplier data).');
    R.meta({std:'Unit weight × volume',src:[MAT[v.matId]?MAT[v.matId].src:'user'],kind:'Calculated',dens:densMeta(v)});

def({id:'fill',cat:'civil',name:'Filling / Backfilling',sub:'Earth / sand filling — compacted volume, loose volume to supply, weight, truck trips',ic:'trench',

    {type:'mat',k:'mat',def:'sand',grp:['Civil'],grp2:true},{k:'truck',l:'Truck / trolley capacity (optional)',dim:'vol',u:'CFT',def:null,base:'CFT',opt:true,units:VOL_UNITS}],
  calc:function(v,R){ R.meta({std:'Engineering geometry; allowance from specification',src:['geom','conv'],kind:'Calculated'}); var V;

    else if(v.mode==='net'){ if(!(v.Vx>0)) return R.err('Excavation volume required'); V=v.Vx-(v.Vs||0); R.step('Backfill (compacted)','V = excavation − structure',nw(v.Vx)+' − '+nw(v.Vs||0),V,'CFT'); }

def({id:'steelratio',cat:'steel',name:'Steel from Concrete Volume',sub:'Reinforcement by kg/CFT, kg/m³ or % of concrete volume',ic:'rebar',

    {k:'steel',l:'Steel quantity',dim:'mass',u:'ton (metric, 1000 kg)',def:10,base:'kg',show:function(v){return v.mode==='ratio';}},Num('kpt','Binding wire kg per ton (your practice)',null,{show:function(v){return v.mode==='ratio';}}),
    Num('wast','Wastage %',0,{allow0:true,conv:true})],
  calc:function(v,R){ var wf=1+(v.wast||0)/100;
    if(v.mode==='ratio'){ if(!(v.steel>0&&v.kpt>0)) return R.err('Steel quantity and kg per ton required'); R.meta({std:'User practice rate',src:['user'],kind:'Calculated'}); var W=v.steel/1000*v.kpt*wf; R.step('Binding wire','tons × kg/ton'+(v.wast?' × (1 + w%)':''),nw(v.steel/1000)+' × '+nw(v.kpt)+(v.wast?' × '+nw(wf):''),W,'kg'); R.res('Binding wire',W,'mass',{main:true,units:['kg']}); R.sum='Binding wire '+nf(W,2)+' kg'; R.shape={sh:'rebar',p:{}}; return; }
